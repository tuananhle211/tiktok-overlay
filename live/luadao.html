<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Khu Tam Thái Tử</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS: a 1080×1920 stage scaled to the window. The office (desks, workers, supervisor,
   flying bricks) is drawn on a canvas that can zoom on someone; the HUD (title, KPI screen, leaderboard, gift list,
   announcements) is HTML on top and never zooms. Satire: everything here is fiction. */
:root{
  --fg:#eef2ea; --muted:#9fb0a6; --acc:#ffcc33; --red:#e5483b; --green:#4fe38a;
  --panel:rgba(14,18,20,.88); --line:rgba(255,204,51,.55); --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:#111}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
#plaque{left:80px;right:80px;top:40px;height:128px;border:3px solid var(--acc);border-radius:18px;box-sizing:border-box;
  background:repeating-linear-gradient(135deg,rgba(255,204,51,.12) 0 18px,rgba(0,0,0,0) 18px 36px),linear-gradient(180deg,#2a2a22,#15160f);
  box-shadow:0 0 0 5px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#title{font-weight:800;font-size:54px;letter-spacing:.04em;color:var(--acc);text-transform:uppercase;text-shadow:0 3px 0 #000}
#subtitle{font-size:24px;font-weight:600;color:#ffe9a8;letter-spacing:.03em}
#pills{top:182px;left:0;right:0;display:flex;justify-content:center;gap:22px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:8px 24px;font-size:30px;font-weight:700;display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.pill small{font-size:18px;font-weight:600;color:var(--muted);line-height:1.05}
.dot{width:16px;height:16px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-sizing:border-box}
.card h3{margin:0 0 8px;text-align:center;font-size:18px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
#board{left:14px;top:262px;width:272px}
#board ol{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:21px}
#board li{display:flex;justify-content:space-between;gap:8px}
#board li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board li span:last-child{color:var(--green);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#board li.empty{justify-content:center;color:var(--muted)}
#legend{right:14px;top:262px;width:272px}
.lg{display:flex;align-items:center;gap:6px;min-height:44px}
.lg+.lg{border-top:1px solid rgba(255,204,51,.15)}
.lg .gifts{position:relative;width:76px;height:40px;flex:none}
.lg .gifts>*{position:absolute;top:0;width:40px;height:40px}
.lg .gifts img{object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.lg .gchip{border-radius:8px;background:rgba(255,255,255,.1);font-size:10px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.lg .arr{color:var(--acc);font-size:20px;flex:none}
.lg .lname{font-weight:700;font-size:19px;line-height:1.15;min-width:0}
.lg.attack .lname{color:#ffa090}
#screen{left:298px;top:262px;width:484px;height:296px;border-radius:14px;border:10px solid #1b1d1e;outline:2px solid #444;box-sizing:border-box;
  background:radial-gradient(ellipse at 50% 0%,#0f3a2a,#06140f 70%);box-shadow:0 0 40px rgba(79,227,138,.25),inset 0 0 40px rgba(0,0,0,.6);padding:10px 16px;color:#b9ffd4;font-weight:700}
#screen .row{display:flex;justify-content:space-between;align-items:baseline}
#screen .h{font-size:22px;color:#7dffb0;letter-spacing:.05em}
#screen .big{font-size:38px;color:#eaffef;margin:2px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}
#screen .big small{font-size:22px;color:#7dffb0}
.bar{position:relative;height:24px;border:2px solid #2f8a57;border-radius:6px;background:#04100b;overflow:hidden}
.bar>div{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#1f9d55,#4fe38a);transition:width .6s}
.bar span{position:absolute;inset:0;text-align:center;font-size:17px;line-height:20px;color:#eaffef}
#orders{list-style:none;margin:8px 0 6px;padding:0;font-size:18px;font-weight:600;color:#cfffe0;display:grid;gap:3px;height:72px;overflow:hidden}
#orders li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#orders .muted{color:#5f9a78}
#screen .foot{font-size:16px;color:#7dffb0;text-align:center;border-top:1px dashed #2f8a57;padding-top:5px;white-space:nowrap}
.banner{left:24px;right:24px;top:262px;z-index:6;text-align:center;border-radius:20px;padding:20px 30px;opacity:0;transform:scale(.88);transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1);box-sizing:border-box}
.banner.show{opacity:1;transform:none}
#loa{border:4px solid var(--acc);background:repeating-linear-gradient(135deg,rgba(255,204,51,.16) 0 22px,rgba(0,0,0,0) 22px 44px),linear-gradient(180deg,#3a1010,#1a0707);box-shadow:0 0 50px rgba(255,80,40,.45)}
#loa .h{font-size:28px;font-weight:800;color:var(--acc);letter-spacing:.12em}
#loa .who{font-size:50px;font-weight:800;color:#fff;margin-top:4px}
#loa .what{font-size:32px;font-weight:700;color:#ffe9a8;margin-top:4px}
#loa .what img{width:58px;height:58px;object-fit:contain;vertical-align:middle;margin:-12px 4px -8px}
#loa .amt{font-size:46px;font-weight:800;color:var(--green);margin-top:6px;text-shadow:0 0 18px rgba(79,227,138,.6)}
#notice{border:3px solid #7dffb0;background:linear-gradient(180deg,rgba(10,30,22,.96),rgba(6,16,12,.96))}
#notice.red{border-color:#ff7a6a;background:linear-gradient(180deg,rgba(60,12,10,.96),rgba(26,6,5,.96))}
#notice .h{font-size:28px;font-weight:800;color:#7dffb0;letter-spacing:.06em}
#notice.red .h{color:#ffb0a4}
#notice p{margin:8px 0 0;font-size:30px;font-weight:600;line-height:1.4}
#unmute{position:absolute;z-index:9;left:50%;top:1500px;transform:translateX(-50%);font:700 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--acc);background:#7a1a12;color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
#debug{position:absolute;z-index:9;left:16px;bottom:12px;font:22px/1.3 ui-monospace,Consolas,monospace;color:#9fe0b4;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.banner{transition:none}.dot{animation:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><div id="title">Khu Tam Thái Tử</div><div id="subtitle">Giả tưởng · Châm biếm · Tỉnh táo trước lừa đảo</div></div>
  <div id="pills" class="ui">
    <div class="pill"><span class="dot"></span><span id="count">0/50</span><small>đang<br>trong ca</small></div>
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
  </div>
  <div id="board" class="card ui"><h3>💰 Lừa được nhiều nhất</h3><ol id="boardList"><li class="empty">Chưa có</li></ol></div>
  <div id="screen" class="ui">
    <div class="row"><span class="h">📊 KPI CA <span id="kpiLevel">1</span></span><span class="h" id="clock">--:--</span></div>
    <div class="big"><span id="kpiDone">0</span> <small>/ <span id="kpiTarget">100 triệu</span></small></div>
    <div class="bar"><div id="kpiBar"></div><span id="kpiPct">0%</span></div>
    <ul id="orders"><li class="muted">Chưa có đơn nào</li></ul>
    <div class="foot">👋 Vào live là vào ca · 💬 Bình luận kẻo ngủ gật</div>
  </div>
  <div id="legend" class="card ui"><h3>🎁 Tặng quà · Chốt đơn</h3><div id="legendList"></div></div>
  <div id="loa" class="ui banner"><div class="h">📢 LOA LOA LOA 📢</div><div class="who" id="loaWho"></div><div class="what" id="loaWhat"></div><div class="amt" id="loaAmt"></div></div>
  <div id="notice" class="ui banner"><div class="h" id="noticeH"></div><p id="noticeP"></p></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
  <div id="debug" hidden></div>
</div></div>

<script>
/* ======================= stage fit ======================= */
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();
const DEBUG=new URLSearchParams(location.search).has('debug');

/* ======================= helpers ======================= */
const W=1080, H=1920, FLOOR_Y=830, SUP_Y=815, SUP_K=1.1, DOOR={x:990,y:826};
const WIN={ x:34, y:606, w:872, h:184 }, TOWER={ x:34+872-80, y:640 }, CCTV={ x:240, y:586 };
const SHIRTS=['#3b6ea8','#a8483b','#3b8a5a','#6b4a9a','#b8862f','#2f8a8a','#5d6066','#a8507a'];
const JACKETS=['#3b4a2c','#4a3426','#2c3a4a','#4a2a2a','#2f2f33','#4a4320'];
const SKIN='#f1c7a0', FONT='"Be Vietnam Pro",system-ui,sans-serif';
const KIND_EMOJI={ 'nem-gach':'🧱', 'hoang-tu':'🤴', 'nft-ga':'🐔', 'khoa-hoc':'📚', 'meo-coin':'🐱', 'dat-mat-trang':'🌕' };
const rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,k)=>a+(b-a)*k, ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(h,to,a)=>{ const c=hexRgb(h), d=to==='w'?255:0; return `rgb(${c.map(v=>Math.round(v+(d-v)*a)).join(',')})`; };
const rgba=(h,a)=>`rgba(${hexRgb(h).join(',')},${a})`;
const num=n=>String(+n.toFixed(1)).replace('.',',');
const fmt=n=>n>=1e9?`${num(n/1e9)} tỷ`:`${num(n/1e6)} triệu`;
const fmtShort=n=>n>=1e9?`${num(n/1e9)} tỷ`:`${num(n/1e6)}tr`;
function canvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function heartPath(g,x,y,k=1){ g.beginPath(); g.moveTo(x,y+8*k); g.bezierCurveTo(x-13*k,y-1*k,x-9*k,y-13*k,x,y-6*k); g.bezierCurveTo(x+9*k,y-13*k,x+13*k,y-1*k,x,y+8*k); g.closePath(); }
const cache={};
function glowSprite(hex){
  return cache['g'+hex] ||= (()=>{ const c=canvas(256,256), g=c.getContext('2d'), gr=g.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,rgba(hex,.9)); gr.addColorStop(.25,rgba(hex,.35)); gr.addColorStop(1,rgba(hex,0)); g.fillStyle=gr; g.fillRect(0,0,256,256); return c; })();
}
function avatarImg(url){ if(!url) return null; let im=cache['a'+url]; if(!im){ im=new Image(); im.referrerPolicy='no-referrer'; im.src=url; cache['a'+url]=im; } return im.naturalWidth?im:null; }

/* ======================= seats: 5 rows × 10 laptops ======================= */
// Front rows fill first, centre outwards, so a small crowd still looks busy on camera. Seats keep their owner;
// a newcomer takes the first free seat.
const ROWS=5, SEATS=[], ROW_GAP=[], ROW_Y=[];
(()=>{ const all=[];
  for(let r=0;r<ROWS;r++){ const t=r/(ROWS-1), y=930+(1790-930)*t, s=.85+.45*t, half=350+140*t, xs=[];
    for(let c=0;c<10;c++){ let u=(c-4.5)/4.5; u=Math.sign(u)*(.08+.92*Math.abs(u)); xs.push(540+u*half); all.push({ x:540+u*half, y, s, r }); }
    ROW_GAP[r]=xs[1]-xs[0]; ROW_Y[r]=y; }                                   // distance between two neighbours: name tags never get wider
  all.sort((a,b)=>(b.r-a.r)||(Math.abs(a.x-540)-Math.abs(b.x-540))).forEach((p,i)=>{ p.i=i; SEATS.push(p); });
})();
let cap=50; const seatOwner=new Array(50).fill(null);
// chairs and the long tables of each row are drawn once into a strip; each frame: chairs, the row's workers, then the tables
let rowLayers=[];
function buildRows(){
  rowLayers=[];
  for(let r=0;r<ROWS;r++){
    const seats=SEATS.filter(p=>p.r===r && p.i<cap); if(!seats.length){ rowLayers.push(null); continue; }
    const s=seats[0].s, y=seats[0].y, top=Math.floor(y-115*s), h=Math.ceil(165*s), yy=y-top;
    const chairs=canvas(W,h), desks=canvas(W,h), gc=chairs.getContext('2d'), gd=desks.getContext('2d');
    for(const p of seats){ const x=p.x; gc.fillStyle='#24272a'; rr(gc,x-24*s,yy-84*s,48*s,58*s,8*s); gc.fill(); gc.fillStyle='rgba(255,255,255,.07)'; rr(gc,x-20*s,yy-80*s,40*s,6*s,3*s); gc.fill(); }
    // one long table on each side of the aisle
    for(const side of [-1,1]){
      const grp=seats.filter(p=>Math.sign(p.x-540)===side); if(!grp.length) continue;
      const x0=Math.min(...grp.map(p=>p.x))-50*s, x1=Math.max(...grp.map(p=>p.x))+50*s;
      gd.fillStyle='#5b5f63'; gd.beginPath(); gd.moveTo(x0,yy); gd.lineTo(x0+6*s,yy-16*s); gd.lineTo(x1-6*s,yy-16*s); gd.lineTo(x1,yy); gd.closePath(); gd.fill();
      gd.fillStyle='#3d4043'; gd.fillRect(x0,yy,x1-x0,34*s); gd.fillStyle='rgba(255,255,255,.09)'; gd.fillRect(x0,yy,x1-x0,2*s);
      gd.fillStyle='rgba(0,0,0,.28)'; gd.fillRect(x0,yy+30*s,x1-x0,4*s);
      gd.fillStyle='#2a2d30'; for(const lx of [x0+6*s,x1-12*s]) gd.fillRect(lx,yy+34*s,6*s,12*s);
    }
    for(const p of seats){
      const x=p.x;
      rr(gd,x-27*s,yy-56*s,54*s,40*s,4*s); gd.fillStyle='#8e979f'; gd.fill(); gd.strokeStyle='#5f666d'; gd.lineWidth=1.5*s; gd.stroke();
      gd.fillStyle='rgba(255,255,255,.35)'; gd.font=`800 ${Math.round(11*s)}px ${FONT}`; gd.textAlign='center'; gd.textBaseline='middle'; gd.fillText('★',x,yy-36*s);
      gd.fillStyle='#2b2f33'; gd.fillRect(x-30*s,yy-17*s,60*s,4*s);
      gd.fillStyle='#1d2023'; gd.fillRect(x+30*s,yy-12*s,12*s,4*s);                    // a phone next to each laptop
    }
    rowLayers.push({ chairs, desks, top });
  }
}

/* ======================= background (drawn once) ======================= */
function buildBackground(){
  const c=canvas(W,H), g=c.getContext('2d');
  let gr=g.createLinearGradient(0,0,0,FLOOR_Y); gr.addColorStop(0,'#2b3134'); gr.addColorStop(1,'#1c2124'); g.fillStyle=gr; g.fillRect(0,0,W,FLOOR_Y);
  for(let i=0;i<2600;i++){ g.fillStyle=`rgba(${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()<.5?255:0},${Math.random()*.035})`; g.fillRect(Math.random()*W,Math.random()*FLOOR_Y,2,2); }
  for(let i=0;i<5;i++){ const x=rand(0,W); gr=g.createLinearGradient(0,FLOOR_Y-260,0,FLOOR_Y); gr.addColorStop(0,'rgba(60,40,20,0)'); gr.addColorStop(1,'rgba(60,40,20,.18)'); g.fillStyle=gr; g.fillRect(x,FLOOR_Y-260,rand(30,90),260); }
  // ceiling light falling on the wall
  for(const x of [200,540,880]){ gr=g.createRadialGradient(x,0,10,x,0,420); gr.addColorStop(0,'rgba(220,255,240,.16)'); gr.addColorStop(1,'rgba(220,255,240,0)'); g.fillStyle=gr; g.fillRect(x-420,0,840,420); }
  // a long barred window: the border casino town at night — towers with neon signs, the compound wall with coils of
  // barbed wire, a guard tower (its searchlight sweeps every frame, see drawOutside). Generic signs only, no real names.
  const { x:WX, y:WY, w:WW, h:WH }=WIN;
  g.fillStyle='#14181b'; g.fillRect(WX-8,WY-8,WW+16,WH+16);
  g.save(); g.beginPath(); g.rect(WX,WY,WW,WH); g.clip();
  gr=g.createLinearGradient(0,WY,0,WY+WH); gr.addColorStop(0,'#060a1a'); gr.addColorStop(.65,'#1b1640'); gr.addColorStop(1,'#43203f'); g.fillStyle=gr; g.fillRect(WX,WY,WW,WH);
  for(let i=0;i<40;i++){ g.fillStyle=`rgba(255,255,255,${rand(.2,.7)})`; g.fillRect(rand(WX,WX+WW),rand(WY,WY+50),1.5,1.5); }
  const pickOf=a=>a[Math.floor(Math.random()*a.length)], signs=[];
  for(let layer=0;layer<2;layer++){
    let tx=WX-20+layer*30;
    while(tx<WX+WW){ const tw=rand(46,104)*(layer?1:.8), th=rand(70,170)*(layer?1:.7), top=WY+WH-34-th;
      g.fillStyle=layer?pickOf(['#11131c','#151827','#1a1622']):'#0c0e16'; g.fillRect(tx,top,tw,th+34);
      for(let yy=top+7;yy<WY+WH-36;yy+=9) for(let xx=tx+5;xx<tx+tw-6;xx+=8) if(Math.random()<(layer?.5:.3)){ g.fillStyle=Math.random()<.8?`rgba(255,214,140,${layer?.8:.45})`:`rgba(170,220,255,${layer?.7:.4})`; g.fillRect(xx,yy,4,5); }
      if(layer && Math.random()<.65) signs.push({ x:tx+tw/2, y:top-10, w:Math.max(54,tw*.85), col:pickOf(['#ff3b6b','#ffd23b','#3bd8ff','#ff8a3b','#c63bff']), text:pickOf(['CASINO','HOTEL','KARAOKE','GAME','CASINO','']) });
      tx+=tw+rand(3,14); }
  }
  for(const s of signs){
    g.globalCompositeOperation='lighter'; g.globalAlpha=.55; g.drawImage(glowSprite(s.col),s.x-s.w,s.y-s.w*.5,s.w*2,s.w); g.globalCompositeOperation='source-over'; g.globalAlpha=1;
    g.fillStyle='#0b0b10'; rr(g,s.x-s.w/2,s.y-11,s.w,22,4); g.fill(); g.strokeStyle=s.col; g.lineWidth=2.5; g.stroke();
    if(s.text){ g.fillStyle=s.col; g.font=`800 14px ${FONT}`; g.textAlign='center'; g.textBaseline='middle'; g.fillText(s.text,s.x,s.y+1); }
  }
  g.fillStyle='#2a2d2f'; g.fillRect(WX,WY+WH-34,WW,34); g.fillStyle='rgba(255,255,255,.05)'; for(let x=WX;x<WX+WW;x+=46) g.fillRect(x,WY+WH-34,2,34);
  g.strokeStyle='#9aa0a6'; g.lineWidth=1.6; for(let x=WX;x<WX+WW+10;x+=13){ g.beginPath(); g.arc(x,WY+WH-42,7,0,7); g.stroke(); }
  for(const fx of [WX+120,WX+430,WX+700]){ g.globalCompositeOperation='lighter'; g.globalAlpha=.6; g.drawImage(glowSprite('#fff2c0'),fx-40,WY+WH-70,80,60); g.globalCompositeOperation='source-over'; g.globalAlpha=1; g.fillStyle='#fff6d8'; g.fillRect(fx-5,WY+WH-46,10,5); }
  g.fillStyle='#1b1f22'; g.fillRect(TOWER.x-5,TOWER.y+18,10,WY+WH-TOWER.y-18); g.fillRect(TOWER.x-30,TOWER.y,60,26); g.beginPath(); g.moveTo(TOWER.x-36,TOWER.y); g.lineTo(TOWER.x,TOWER.y-22); g.lineTo(TOWER.x+36,TOWER.y); g.fill();
  g.fillStyle='#ffe9a0'; g.fillRect(TOWER.x-22,TOWER.y+8,10,8);
  g.restore();
  g.fillStyle='#55595c'; for(let x=WX+18;x<WX+WW;x+=30) g.fillRect(x,WY,6,WH); g.fillRect(WX,WY+WH*.42,WW,6);
  g.strokeStyle='#3a3d40'; g.lineWidth=8; g.strokeRect(WX,WY,WW,WH);

/* ======================= audio ======================= */
let AC=null, master=null, amb=null, sfx=null, noiseBuf=null;
document.getElementById('unmute').onclick=e=>{ e.currentTarget.remove(); startAudio(); };
function noise(sec){ const len=Math.floor(AC.sampleRate*sec), b=AC.createBuffer(1,len,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; return b; }
function startAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  amb=AC.createGain(); amb.gain.value=settings.music?1:0; amb.connect(master);
  sfx=AC.createGain(); sfx.connect(master);
  noiseBuf=noise(1);
  for(const [f,a] of [[100,.012],[200,.005]]){ const o=AC.createOscillator(); o.frequency.value=f; const g=AC.createGain(); g.gain.value=a; o.connect(g); g.connect(amb); o.start(); }
  // keyboards: more people in the room, more clicks
  setInterval(()=>{ if(!people.size || Math.random()>Math.min(.85,people.size/20)) return; click(); },70);
  paChime();
}
function click(){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=rand(1800,4200); f.Q.value=2; const g=AC.createGain(), t=AC.currentTime; g.gain.setValueAtTime(rand(.04,.09),t); g.gain.exponentialRampToValueAtTime(.0005,t+.03); s.connect(f); f.connect(g); g.connect(amb); s.start(t,rand(0,.9),.04); }
function tone(f,t,d,a,type='sine'){ const o=AC.createOscillator(); o.type=type; o.frequency.value=f; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.02); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+d+.05); return o; }
function paChime(){ if(!AC) return; const t=AC.currentTime; [784,659,523].forEach((f,i)=>tone(f,t+i*.32,.9,.12)); }
function thud(){ if(!AC) return; const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=500; const g=AC.createGain(); g.gain.setValueAtTime(.6,t); g.gain.exponentialRampToValueAtTime(.001,t+.25); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,0,.3);
  const o=tone(140,t,.22,.35); o.frequency.exponentialRampToValueAtTime(55,t+.2); }
function whoosh(){ if(!AC) return; const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='bandpass'; f.Q.value=1.5; f.frequency.setValueAtTime(600,t); f.frequency.exponentialRampToValueAtTime(2400,t+.35); const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.12,t+.15); g.gain.exponentialRampToValueAtTime(.001,t+.45); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,0,.5); }
function cheer(){ if(!AC) return; const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noise(2.6); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1100; f.Q.value=.6; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.3); g.gain.setValueAtTime(.22,t+1.4); g.gain.exponentialRampToValueAtTime(.001,t+2.5); s.connect(f); f.connect(g); g.connect(sfx); s.start(t); }
function airhorn(){ if(!AC) return; const t=AC.currentTime; for(let b=0;b<3;b++) for(const f of [233,294,349]) tone(f,t+b*.42,.36,.05,'sawtooth'); }
function hornBlast(){ if(!AC) return; const t=AC.currentTime; for(const f of [233,294,349]) tone(f,t,.55,.07,'sawtooth'); }
function whistleDown(){ if(!AC) return; const t=AC.currentTime, o=tone(1300,t,.9,.08); o.frequency.exponentialRampToValueAtTime(260,t+.85); }
function pop(){ if(!AC) return; const t=AC.currentTime, s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=rand(700,1400); const g=AC.createGain(); g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.6); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,0,.7); }
function ramp(node,v){ if(!node) return; const t=AC.currentTime; node.gain.cancelScheduledValues(t); node.gain.setValueAtTime(node.gain.value,t); node.gain.linearRampToValueAtTime(v,t+.4); }
function duck(on){ ramp(amb, !settings.music?0:on?.25:1); }
const ttsQ=[]; let ttsPlaying=false;
function queueTTS(url){ ttsQ.push(url); playTTS(); }
function playTTS(){
  if(ttsPlaying||!ttsQ.length||!AC) return; ttsPlaying=true;
  const el=new Audio(ttsQ.shift()), src=AC.createMediaElementSource(el), g=AC.createGain(); g.gain.value=1.3; src.connect(g); g.connect(master);
  el.onplay=()=>duck(true); el.onended=el.onerror=()=>{ duck(false); ttsPlaying=false; setTimeout(playTTS,350); };
  el.play().catch(()=>{ ttsPlaying=false; });
}

/* ======================= server link ======================= */
let ws=null;
function setCap(c){ if(!c || c===cap) return; cap=c; for(const [id,P] of people) if(P.seat>=cap) removePerson(id,false); buildRows(); }
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='mất kết nối server… đang thử lại'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.t){
      case 'state':
        if(m.overlay && m.overlay!==location.pathname){ location.replace(m.overlay+location.search); return; }   // the server switched theme
        Object.assign(settings,m.settings); applySettings(); startedAt=m.startedAt;
        people.clear(); seatOwner.fill(null); cap=m.cap||50; buildRows();
        for(const v of m.viewers||[]) addPerson(v,true);
        renderBoard(m.top); renderKpi(m.kpi); setSup(m.sup,true); setGiftMap(m.giftMap); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); setCap(m.cap); break;
      case 'giftmap': setGiftMap(m.giftMap); break;
      case 'join': setCap(m.cap); addPerson(m.v,false); break;
      case 'leave': removePerson(m.id,false); break;
      case 'kick': removePerson(m.id,true); break;
      case 'look': { const P=people.get(m.id); if(P){ P.look=m.look; P.glow=.8; } } break;
      case 'nap': { const P=people.get(m.id); if(P) P.asleep=true; } break;
      case 'wake': if(!wakeQ.some(w=>w.id===m.id)) wakeQ.push(m); break;
      case 'awake': {                                                   // they commented / gifted / liked: awake and the card is gone
        const P=people.get(m.id); if(P){ P.asleep=false; P.card=null; }
        const i=wakeQ.findIndex(w=>w.id===m.id); if(i>=0) wakeQ.splice(i,1);
        if(sup.state==='goto' && sup.visit?.P.id===m.id){ sup.visit.done=true; walkBack(performance.now()); }
      } break;
      case 'chat': { const P=people.get(m.id); if(P){ P.bubble={ spr:bubbleSprite(m.text), until:performance.now()+5500 }; P.jump=.5; } } break;
      case 'like': { const P=people.get(m.id); if(P){ const h=headPos(P); for(let i=0;i<Math.min(4,m.n||1);i++) parts.push({ k:'heart', x:h.x+rand(-14,14), y:h.y-20*P.s, vx:rand(-15,15), vy:-rand(50,90), t:0, life:rand(1.4,2), s:rand(.8,1.3)*P.s+.3 }); } } break;
      case 'gift': onGift(m); break;
      case 'hit': onHit(m); break;
      case 'ko': if(inFlight>0) koPending=m; else doKO(m); break;
      case 'kpiup': { const n=m.kpi.level-(m.from||m.kpi.level-1); renderKpi(m.kpi); showNotice(n>1?`🎉 VƯỢT LIỀN ${n} CA KPI!`:`🎉 VƯỢT KPI CA ${m.kpi.level-1}!`,`Cả phòng ăn mừng · KPI ca ${m.kpi.level}: ${fmt(m.kpi.target)}`,false,8000); setTimeout(()=>celebrate(true),300); } break;
      case 'giaoban': paChime(); supSay(m.text.length>60?m.text.slice(0,58)+'…':m.text,6000); sup.pauseUntil=performance.now()+5000; showNotice(`📢 HỌP GIAO BAN · ${m.sup}`,m.text,false,11000); break;
      case 'sup': setSup(m.sup,false); break;
      case 'bell': paChime(); supSay('Alo alo! Tập trung!',3000); break;
      case 'tts': queueTTS(m.url); break;
    }
  };
}
function applySettings(){
  document.getElementById('title').textContent=settings.title||'Khu Tam Thái Tử';
  document.getElementById('subtitle').textContent=settings.subtitle||'';
  duck(false);
}

  const s=P.s, x=P.x, y=P.y+P.dy, sh=SHIRTS[P.shirt%8];

  if(P.glow>0){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=P.glow*.8; const r=110*s; ctx.drawImage(glowSprite('#ffcc33'),x-r,y-80*s-r,r*2,r*2); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=P.alpha; }

  else { const ty=Math.sin(t*16+P.ph)*3*s; for(const k of [-1,1]){ ctx.beginPath(); ctx.moveTo(x+k*21*s,y-58*s); ctx.lineTo(x+k*16*s,y-28*s+(k>0?ty:-ty)); ctx.stroke(); } }

  ctx.globalAlpha=1;
  if(P.card){ ctx.save(); ctx.translate(x+27*s,y-(asleep?96:110)*s); ctx.rotate(.25); rr(ctx,-7*s,-10*s,14*s,20*s,2*s); ctx.fillStyle='#ffd21f'; ctx.fill(); ctx.strokeStyle='#a88400'; ctx.lineWidth=1.5*s; ctx.stroke(); ctx.restore(); }   // yellow card

function drawWalker(P,now){

    else if(p.k==='dust'){ p.vx*=.9; p.vy*=.9; ctx.globalAlpha=a*.7; ctx.fillStyle='#b98a6a'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); }
    else if(p.k==='heart'){ ctx.globalAlpha=a; ctx.fillStyle='#ff5a7a'; heartPath(ctx,p.x,p.y,p.s); ctx.fill(); }
    else if(p.k==='fw'){ p.vx*=1-1.5*dt; p.vy=p.vy*(1-1.5*dt)+55*dt; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*(p.t>p.life*.65?.55+.45*Math.sin(p.t*30+i):1); ctx.drawImage(glowSprite(p.col),p.x-11,p.y-11,22,22); ctx.globalCompositeOperation='source-over'; }
  }
  ctx.globalAlpha=1;
}
// the guard tower's searchlight sweeping over the town, and the CCTV light blinking
function drawOutside(t){
  ctx.save(); ctx.beginPath(); ctx.rect(WIN.x,WIN.y,WIN.w,WIN.h); ctx.clip();
  const a=-Math.PI/2+Math.sin(t*.45)*1.15, len=900, spread=.09, ox=TOWER.x-17, oy=TOWER.y+12;
  const gr=ctx.createLinearGradient(ox,oy,ox+Math.cos(a)*len,oy+Math.sin(a)*len); gr.addColorStop(0,'rgba(255,248,210,.42)'); gr.addColorStop(1,'rgba(255,248,210,0)');
  ctx.globalCompositeOperation='lighter'; ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(ox,oy); ctx.lineTo(ox+Math.cos(a-spread)*len,oy+Math.sin(a-spread)*len); ctx.lineTo(ox+Math.cos(a+spread)*len,oy+Math.sin(a+spread)*len); ctx.closePath(); ctx.fill();
  ctx.restore(); ctx.globalCompositeOperation='source-over';
  if(Math.sin(t*4)>0){ ctx.globalCompositeOperation='lighter'; ctx.drawImage(glowSprite('#ff2a2a'),CCTV.x-28,CCTV.y-14,22,22); ctx.globalCompositeOperation='source-over'; ctx.fillStyle='#ff3030'; ctx.beginPath(); ctx.arc(CCTV.x-17,CCTV.y-3,2.5,0,7); ctx.fill(); }
}
let last=performance.now(), fpsN=0, fpsT=0;
const dbg=document.getElementById('debug'); if(DEBUG) dbg.hidden=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000, cheering=now<cheerUntil;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H); applyCamera(now);
  ctx.drawImage(BG,0,0);
  drawOutside(t);
  updateSup(t,dt,now);
  const supInRoom=sup.y>FLOOR_Y+20; let supDrawn=!supInRoom; if(!supInRoom) drawSup(t,now);
  // shells rise from behind the desks, burst over the room
  ctx.globalCompositeOperation='lighter';
  for(let i=shells.length-1;i>=0;i--){ const s=shells[i], e=(now-s.t0)/1000; if(e<0) continue;
    if(e<.6){ const k=1-(1-e/.6)**2, y=1100+(s.y-1100)*k; ctx.globalAlpha=.9; ctx.drawImage(glowSprite('#ffd27a'),s.x-9,y-9,18,18); }
    else { for(let j=0;j<70;j++){ const a=j/70*6.283+rand(0,.1), v=rand(160,300); parts.push({ k:'fw', x:s.x, y:s.y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, life:rand(1.4,2.2), col:s.hex }); } pop(); shells.splice(i,1); } }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // rows back to front: chairs, the people sitting there, desks, then their name tags
  const bubbles=[];
  for(let r=0;r<ROWS;r++){
    if(!supDrawn && sup.y<ROW_Y[r]){ drawSup(t,now); supDrawn=true; }   // walking among the desks: in front of the rows behind him, behind the rows in front
    const L=rowLayers[r]; if(!L) continue;
    ctx.drawImage(L.chairs,0,L.top);
    const rowPeople=[...people.values()].filter(P=>P.state==='sit' && SEATS[P.seat].r===r);
    for(const P of rowPeople){
      P.glow=Math.max(0,P.glow-dt*.5); P.jump=Math.max(0,P.jump-dt*1.6);
      P.dy=-(cheering?Math.abs(Math.sin(t*9+P.ph))*20:0)*P.s - Math.sin(Math.min(1,P.jump)*Math.PI)*26*P.s;
      drawWorker(P,t,now,cheering);
      if(P.bubble){ if(now<P.bubble.until) bubbles.push(P); else P.bubble=null; }
    }
    ctx.drawImage(L.desks,0,L.top);
    for(const P of rowPeople){ const tg=tagSprite(P), k=Math.min(P.s*.62,ROW_GAP[r]*.95/tg.width); ctx.drawImage(tg,P.x-tg.width*k/2,P.y+40*P.s,tg.width*k,tg.height*k); }
  }
  if(!supDrawn) drawSup(t,now);
  for(const P of people.values()) if(P.state==='walk') drawWalker(P,now);
  for(let i=leaving.length-1;i>=0;i--) if(drawWalker(leaving[i],now)) leaving.splice(i,1);
  // flying bricks and slippers
  for(let i=shots.length-1;i>=0;i--){ const s=shots[i], k=(now-s.t0)/s.dur;
    if(k>=1){ shots.splice(i,1); landShot(s); inFlight=Math.max(0,inFlight-1); if(!inFlight){ if(sup.hpAfter!=null){ sup.shown=sup.hpAfter; sup.hpAfter=null; } if(koPending){ const m=koPending; koPending=null; doKO(m); } } continue; }
    const x=lerp(s.x0,s.x1,k), y=lerp(s.y0,s.y1,k)-Math.sin(k*Math.PI)*260; ctx.save(); ctx.translate(x,y); ctx.rotate(k*s.spin); ctx.drawImage(s.spr,-s.spr.width/2,-s.spr.height/2); ctx.restore(); }
  drawParticles(dt);
  // newest chat bubbles only, so the room never turns into a wall of text
  bubbles.sort((a,b)=>b.bubble.until-a.bubble.until).slice(0,4).forEach(P=>{ const b=P.bubble.spr, k=Math.max(.75,P.s), h=headPos(P); ctx.drawImage(b,h.x-b.width*k/2,h.y-30*P.s-b.height*k,b.width*k,b.height*k); });
  if(DEBUG){ fpsN++; fpsT+=dt; if(fpsT>=1){ dbg.textContent=`${Math.round(fpsN/fpsT)} fps · ${people.size} người · ${parts.length} hạt · ${shots.length} gạch`; fpsN=0; fpsT=0; } }
}
buildRows();
requestAnimationFrame(frame);
</script>

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Vườn Chống Zombie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS: a 1080×1920 stage scaled to the window. The field (zombies, plants, bullets,
   explosions) is a canvas; the HUD (title, gift list, level bar, leaderboards, banners) is HTML on top. The server runs
   the game, this page only draws it. */
:root{
  --fg:#f1f5e9; --muted:#a9b8a0; --acc:#b6ff4a; --red:#ff5a4a; --gold:#ffd23f;
  --panel:rgba(10,16,10,.86); --line:rgba(182,255,74,.5); --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:#0b120b}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
#plaque{left:70px;right:70px;top:22px;height:100px;border:3px solid var(--acc);border-radius:18px;box-sizing:border-box;
  background:linear-gradient(180deg,#1f3a12,#0e1a08);box-shadow:0 0 0 5px rgba(0,0,0,.35),0 0 30px rgba(182,255,74,.25) inset;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
#title{font-weight:800;font-size:48px;letter-spacing:.03em;color:var(--acc);text-transform:uppercase;text-shadow:0 3px 0 #000,0 0 18px rgba(182,255,74,.4)}
#subtitle{font-size:21px;font-weight:600;color:#e3f5c4}
#giftbar{left:14px;right:14px;top:132px;display:flex;gap:6px;justify-content:center}
.gchip{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:4px 8px;box-sizing:border-box;height:52px}
.gchip .ic{position:relative;width:40px;height:40px;flex:none}
.gchip .ic>*{position:absolute;top:0;width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.gchip .ic span{border-radius:8px;background:rgba(255,255,255,.1);font-size:9px;line-height:1.05;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.gchip b{font-size:17px;line-height:1.1;font-weight:800}
.gchip.nuke{border-color:#ff7a4a}.gchip.nuke b{color:#ffb08a}
#levelbar{left:14px;right:14px;top:194px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;box-sizing:border-box}
#levelbar .row{display:flex;align-items:center;gap:12px}
#lvl{font-size:30px;font-weight:800;color:var(--gold);white-space:nowrap;min-width:150px}
.bar{position:relative;flex:1;height:26px;border:2px solid #3d6a1f;border-radius:8px;background:#071006;overflow:hidden}
.bar>div{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .4s}
#prog>div{background:linear-gradient(90deg,#3d9a1f,#b6ff4a)}
#fenceBar>div{background:linear-gradient(90deg,#a8641e,#ffb54a)}
.bar span{position:absolute;inset:0;text-align:center;font-size:17px;font-weight:700;line-height:22px;color:#f6ffe8;text-shadow:0 1px 2px #000}
#fenceBar{flex:0 0 250px}
/* how to play: three big boxes so a viewer gets it at a glance */
#guide{left:14px;right:14px;top:262px;display:flex;gap:8px}
#guide .how{flex:1 1 0;min-width:0;background:var(--panel);border:3px solid var(--line);border-radius:16px;padding:8px 10px;box-sizing:border-box;text-align:center}
#guide .how .k{font-size:25px;font-weight:800;line-height:1.15;color:#fff}
#guide .how .v{font-size:22px;font-weight:700;line-height:1.2;color:var(--acc);margin-top:3px}
#guide .how.tap{border-color:#ff7ab0;animation:tap 1.1s ease-in-out infinite}
#guide .how.tap .v{color:#ffb3d0}
@keyframes tap{50%{box-shadow:0 0 0 5px rgba(255,122,176,.35),0 0 26px rgba(255,122,176,.55);transform:scale(1.03)}}
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 12px;box-sizing:border-box;width:262px}
.card h3{margin:0 0 4px;text-align:center;font-size:18px;font-weight:800;color:var(--acc);text-transform:uppercase;white-space:nowrap}
.card ol{margin:0;padding:0;list-style:none;display:grid;gap:2px;font-size:19px}
.card li{display:flex;justify-content:space-between;gap:8px}
.card li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card li span:last-child{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
.card li.empty{justify-content:center;color:var(--muted)}
#boardDmg{left:14px;top:382px}
#boardKill{right:14px;top:382px}
/* the boss's health, between the two leaderboards */
#bossbar{left:290px;right:290px;top:392px;background:rgba(40,8,6,.92);border:3px solid var(--red);border-radius:14px;padding:6px 10px 8px;box-sizing:border-box;opacity:0;transform:translateY(-10px);transition:opacity .4s,transform .4s}
#bossbar.show{opacity:1;transform:none}
#bossbar .t{font-size:22px;font-weight:800;color:#ffb0a0;text-align:center;line-height:1.25;margin-bottom:4px;text-shadow:0 2px 0 #000}
#bossHp{height:30px;border-color:#8a1a10;background:#1a0503}
#bossHp>div{background:linear-gradient(90deg,#8a0a0a,#ff4a2a 70%,#ff9a4a);transition:width .25s}
.banner{left:60px;right:60px;top:760px;z-index:6;text-align:center;border-radius:22px;padding:20px 28px;opacity:0;transform:scale(.85);transition:opacity .35s,transform .35s cubic-bezier(.2,1.4,.4,1);box-sizing:border-box;background:rgba(10,18,8,.92);border:4px solid var(--acc)}
.banner.show{opacity:1;transform:none}
.banner .h{font-size:46px;font-weight:800;color:var(--acc);text-shadow:0 3px 0 #000}
.banner p{margin:6px 0 0;font-size:30px;font-weight:700}
.banner p img{width:56px;height:56px;object-fit:contain;vertical-align:middle;margin:-10px 4px -8px}
.banner.red{border-color:var(--red);background:rgba(40,8,6,.92)}.banner.red .h{color:#ff9a8a}
.banner.gold{border-color:var(--gold)}.banner.gold .h{color:var(--gold)}
#unmute{position:absolute;z-index:9;left:50%;top:1100px;transform:translateX(-50%);font:700 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--acc);background:#2a5a14;color:#f6ffe8;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:8px;font-size:20px;color:var(--muted);opacity:.6}
#debug{position:absolute;z-index:9;left:16px;bottom:8px;font:22px/1.3 ui-monospace,Consolas,monospace;color:#9fe0b4;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px}
@media (prefers-reduced-motion:reduce){.banner{transition:none}#guide .how.tap{animation:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><div id="title">Vườn Chống Zombie</div><div id="subtitle">Nhấp liên tục vào màn hình để bắn zombie</div></div>
  <div id="giftbar" class="ui"></div>
  <div id="levelbar" class="ui">
    <div class="row"><div id="lvl">MÀN 1</div><div class="bar" id="prog"><div></div><span>Chờ người chơi…</span></div><div class="bar" id="fenceBar"><div></div><span>🧱 Rào 100</span></div></div>
  </div>
  <div id="guide" class="ui">
    <div class="how tap"><div class="k">👆 NHẤP LIÊN TỤC<br>VÀO MÀN HÌNH</div><div class="v">= BẮN ZOMBIE</div></div>
    <div class="how"><div class="k">💬 GÕ 1 · 2 · 3</div><div class="v">= đổi đạn<br>xanh · băng · lửa</div></div>
    <div class="how"><div class="k">➕ FOLLOW</div><div class="v">= bắn<br>ĐẠI BÁC 💣</div></div>
  </div>
  <div id="boardDmg" class="card ui"><h3>💥 Sát thương</h3><ol id="dmgList"><li class="empty">Chưa có</li></ol></div>
  <div id="boardKill" class="card ui"><h3>☠️ Tiêu diệt</h3><ol id="killList"><li class="empty">Chưa có</li></ol></div>
  <div id="bossbar" class="ui"><div class="t" id="bossT">👹 BOSS</div><div class="bar" id="bossHp"><div></div><span></span></div></div>
  <div id="banner" class="ui banner"><div class="h" id="bannerH"></div><p id="bannerP"></p></div>
  <button id="unmute">🔊 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
  <div id="debug" hidden></div>
</div></div>

<script>
/* ======================= stage fit ======================= */
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();
const DEBUG=new URLSearchParams(location.search).has('debug');

/* ======================= helpers ======================= */
const W=1080, H=1920, SPAWN_Y=560, FENCE_Y=1470, FONT='"Be Vietnam Pro",system-ui,sans-serif';
const TYPE_COL={ 1:'#5cf05a', 2:'#5ad0ff', 3:'#ff6a2a' }, TYPE_NAME={ 1:'xanh', 2:'băng', 3:'lửa' };
const KIND_EMOJI={ 'nang-cap':'⬆️', 'mua-dan':'🌧️', 'dai-bac':'💣', 'u-sung':'🔫', 'hat-nhan':'☢️' };
const rand=(a,b)=>a+Math.random()*(b-a), lerp=(a,b,k)=>a+(b-a)*k, ease=k=>k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgba=(h,a)=>`rgba(${hexRgb(h).join(',')},${a})`;
const mix=(h,to,a)=>{ const c=hexRgb(h), d=to==='w'?255:0; return `rgb(${c.map(v=>Math.round(v+(d-v)*a)).join(',')})`; };
function canvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
const cache={};
function glowSprite(hex){ return cache['g'+hex] ||= (()=>{ const c=canvas(128,128), g=c.getContext('2d'), gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,rgba(hex,.95)); gr.addColorStop(.3,rgba(hex,.4)); gr.addColorStop(1,rgba(hex,0)); g.fillStyle=gr; g.fillRect(0,0,128,128); return c; })(); }
function avatarImg(url){ if(!url) return null; let im=cache['a'+url]; if(!im){ im=new Image(); im.referrerPolicy='no-referrer'; im.src=url; cache['a'+url]=im; } return im.naturalWidth?im:null; }
const hash=s=>{ let h=0; for(const ch of String(s)) h=(h*31+ch.codePointAt(0))>>>0; return h; };

/* ======================= background (drawn once) ======================= */
function buildBackground(){
  const c=canvas(W,H), g=c.getContext('2d');
  // a sunny sky with a slow sunburst behind the title
  let gr=g.createLinearGradient(0,0,0,620); gr.addColorStop(0,'#ffe36a'); gr.addColorStop(1,'#ffbf2e'); g.fillStyle=gr; g.fillRect(0,0,W,620);
  g.save(); g.translate(540,-160); for(let i=0;i<28;i++){ if(i%2===0){ g.fillStyle='rgba(255,255,255,.2)'; g.beginPath(); g.moveTo(0,0); g.lineTo(Math.cos(i/28*Math.PI*2)*1600-60*Math.sin(i/28*Math.PI*2),Math.sin(i/28*Math.PI*2)*1600+60*Math.cos(i/28*Math.PI*2)); g.lineTo(Math.cos((i+1)/28*Math.PI*2)*1600,Math.sin((i+1)/28*Math.PI*2)*1600); g.closePath(); g.fill(); } } g.restore();
  // the meadow the zombies cross: bright grass with soft lighter and darker patches
  gr=g.createLinearGradient(0,440,0,FENCE_Y); gr.addColorStop(0,'#58a832'); gr.addColorStop(1,'#4a9a2a'); g.fillStyle=gr; g.fillRect(0,440,W,FENCE_Y-440);
  for(let i=0;i<46;i++){ g.fillStyle=Math.random()<.5?'rgba(160,230,90,.16)':'rgba(30,90,20,.14)'; g.beginPath(); g.ellipse(rand(0,W),rand(560,FENCE_Y-20),rand(60,160),rand(26,60),0,0,7); g.fill(); }
  for(let i=0;i<1500;i++){ g.strokeStyle=`rgba(${Math.random()<.5?'150,220,80':'40,110,25'},${rand(.3,.7)})`; g.lineWidth=2; const x=rand(0,W), y=rand(560,FENCE_Y); g.beginPath(); g.moveTo(x,y); g.lineTo(x+rand(-3,3),y-rand(6,12)); g.stroke(); }
  for(let i=0;i<70;i++){ const x=rand(20,W-20), y=rand(600,FENCE_Y-30), col=['#ffffff','#ffe14a','#ff8ab8'][i%3];
    for(let k=0;k<5;k++){ g.fillStyle=col; g.beginPath(); g.arc(x+Math.cos(k*1.256)*4,y+Math.sin(k*1.256)*4,3,0,7); g.fill(); } g.fillStyle='#ffb020'; g.beginPath(); g.arc(x,y,2.4,0,7); g.fill(); }
  // tombstones and a hedge on the horizon, where the zombies come from
  const OUT='#24451a';
  const grave=(x,y,s)=>{ g.fillStyle='#a8aeb0'; rr(g,x-16*s,y-40*s,32*s,40*s,14*s); g.fill(); g.strokeStyle='#4a5052'; g.lineWidth=3; g.stroke(); g.fillStyle='rgba(255,255,255,.35)'; rr(g,x-11*s,y-34*s,6*s,24*s,3*s); g.fill();
    g.strokeStyle='#6a7072'; g.lineWidth=3*s; g.beginPath(); g.moveTo(x+2*s,y-30*s); g.lineTo(x+2*s,y-12*s); g.moveTo(x-5*s,y-24*s); g.lineTo(x+9*s,y-24*s); g.stroke(); };
  for(let x=-40;x<W+80;x+=rand(70,110)){ const r=rand(55,80), y=500+rand(-10,10); gr=g.createRadialGradient(x-r*.3,y-r*.4,4,x,y,r); gr.addColorStop(0,'#7cc84a'); gr.addColorStop(1,'#2f7a22'); g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.strokeStyle=OUT; g.lineWidth=4; g.stroke(); }
  g.fillStyle='#3a8a26'; g.fillRect(0,520,W,50);
  gr=g.createLinearGradient(0,540,0,600); gr.addColorStop(0,'rgba(20,60,10,.35)'); gr.addColorStop(1,'rgba(20,60,10,0)'); g.fillStyle=gr; g.fillRect(0,540,W,60);
  for(const [x,y,s] of [[110,600,1],[250,575,.85],[400,590,.9],[690,580,.85],[850,605,1.05],[985,575,.85]]) grave(x,y,s);
  // the garden behind the fence
  gr=g.createLinearGradient(0,FENCE_Y,0,H); gr.addColorStop(0,'#6cc443'); gr.addColorStop(1,'#4a9e2c'); g.fillStyle=gr; g.fillRect(0,FENCE_Y,W,H-FENCE_Y);
  for(let i=0;i<900;i++){ g.strokeStyle=`rgba(${Math.random()<.5?'170,235,100':'50,120,30'},${rand(.3,.6)})`; g.lineWidth=2; const x=rand(0,W), y=rand(FENCE_Y+10,H); g.beginPath(); g.moveTo(x,y); g.lineTo(x+rand(-3,3),y-rand(6,12)); g.stroke(); }
  for(let i=0;i<40;i++){ g.fillStyle=['#ffe14a','#ff7ab0','#ffffff'][i%3]; g.beginPath(); g.arc(rand(0,W),rand(FENCE_Y+20,H),2.5,0,7); g.fill(); }
  gr=g.createRadialGradient(540,1100,500,540,1100,1200); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(40,30,0,.25)'); g.fillStyle=gr; g.fillRect(0,0,W,H);
  return c;
}
const BG=buildBackground();
const FOG=Array.from({length:7},()=>({ x:rand(0,W), y:rand(480,1350), r:rand(160,300), v:rand(6,16), a:rand(.03,.06) }));   // light drifting haze

/* ======================= plants: 3 rows × 10 behind the fence ======================= */
// The row nearest the fence fills first, centre outwards.
const SLOTS=[];
(()=>{ const all=[]; [1620,1745,1870].forEach((y,r)=>{ for(let c=0;c<10;c++) all.push({ x:r%2?(c===9?46:145+c*99):95+c*99, y, r, c }); });
  all.sort((a,b)=>(a.r-b.r)||(Math.abs(a.x-540)-Math.abs(b.x-540))).forEach((p,i)=>{ p.i=i; SLOTS.push(p); }); })();
let cap=30; const slotOwner=new Array(30).fill(null), plants=new Map();
function addPlant(v,instant){
  const P0=plants.get(v.id); if(P0){ Object.assign(P0,{ name:v.name, avatar:v.avatar, type:v.type, wlv:v.wlv }); return P0; }
  let i=-1; for(let k=0;k<cap;k++) if(!slotOwner[k]){ i=k; break; } if(i<0) return null;
  const S=SLOTS[i], P={ ...v, slot:i, x:S.x, y:S.y, grow:instant?1:0, recoil:0, glow:0, ph:rand(0,6.28), bubble:null, head:null, tag:null, wiltK:v.wilted?1:0 };
  slotOwner[i]=v.id; plants.set(v.id,P); return P;
}
function removePlant(id){ const P=plants.get(id); if(!P) return; plants.delete(id); slotOwner[P.slot]=null; for(let i=0;i<10;i++) parts.push({ k:'leaf', x:P.x+rand(-20,20), y:P.y-60, vx:rand(-80,80), vy:rand(-160,-60), t:0, life:1.2, col:'#5aa83a', rot:rand(0,6), vr:rand(-6,6) }); }
// Plants (an original design in a bright cartoon style): a rosette of big glossy leaves on a little mound, a curved stem
// and a round shiny head with big eyes looking up at the zombies. The mouth on top is a flower in the bullet's colour that
// spits the seeds, and the head is tinted by the bullet type (green, icy, fiery). The viewer's avatar is a round badge at
// the foot of the plant. Every gun level makes the plant 9% bigger and gives it an aura: green glow (2), blue rays (3),
// purple rays and orbiting sparks (4), golden double rays, a halo on the ground and rising sparkles (5).
const PS=.8, SPR2=2;                               // plant scale on stage; sprites drawn at 2× so they stay crisp
const OUTL={ 1:'#1d4a10', 2:'#12465a', 3:'#5a2208' };
const HEADC={ 1:['#f6ffc8','#bdf060','#6cc22e','#3f8a1c'], 2:['#f2ffff','#b4f2f4','#52c4d6','#24788c'], 3:['#fff4c8','#ffd45e','#f28a2c','#a8461a'] };
const LV_COL={ 2:'#7dff5a', 3:'#4ac8ff', 4:'#c46aff', 5:'#ffd23f' };
const plantK=P=>1+((P.wlv||1)-1)*.09;
const muzzle=P=>{ const L=plantK(P); return { x:P.x+Math.sin(performance.now()/625+P.ph)*2, y:P.y-180*PS*L }; };
function bodySprite(){
  return cache.plantBody2 ||= (()=>{ const c=canvas(130*SPR2,100*SPR2), g=c.getContext('2d'), O='#1d4a10'; g.scale(SPR2,SPR2); g.translate(65,94); g.lineJoin='round';
    g.fillStyle='#8a5428'; g.beginPath(); g.ellipse(0,-2,36,9,0,0,7); g.fill(); g.strokeStyle='#4a2a12'; g.lineWidth=2.5; g.stroke();
    // big leaves spreading on the ground
    const leaf=(a,len,wd)=>{ g.save(); g.translate(0,-8); g.rotate(a); g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(len*.3,-wd,len*.8,-wd,len,0); g.bezierCurveTo(len*.8,wd*.9,len*.3,wd*.9,0,0); g.closePath();
      const lg=g.createLinearGradient(0,-wd,0,wd); lg.addColorStop(0,'#b4f06a'); lg.addColorStop(1,'#3f9a22'); g.fillStyle=lg; g.fill(); g.strokeStyle=O; g.lineWidth=3; g.stroke();
      g.strokeStyle='rgba(255,255,255,.4)'; g.lineWidth=2; g.beginPath(); g.moveTo(6,-1); g.quadraticCurveTo(len*.5,-wd*.35,len*.85,-1); g.stroke(); g.restore(); };
    leaf(Math.PI+.5,46,13); leaf(-.5,46,13); leaf(Math.PI+.12,56,16); leaf(.12,56,16);
    // curved stem
    g.beginPath(); g.moveTo(-6,-8); g.quadraticCurveTo(-13,-46,-6,-84); g.lineTo(6,-84); g.quadraticCurveTo(-1,-46,6,-8); g.closePath();
    const sg=g.createLinearGradient(-10,0,8,0); sg.addColorStop(0,'#4f9e2a'); sg.addColorStop(.5,'#a6e85a'); sg.addColorStop(1,'#4f9e2a'); g.fillStyle=sg; g.fill(); g.strokeStyle=O; g.lineWidth=3; g.stroke();
    return c; })();
}
function headSprite(P){
  const key='h'+P.type;
  return cache[key] ||= (()=>{
    const c=canvas(120*SPR2,130*SPR2), g=c.getContext('2d'), col=TYPE_COL[P.type], O=OUTL[P.type], hc=HEADC[P.type]; g.scale(SPR2,SPR2); g.translate(60,80); g.lineJoin='round'; g.lineCap='round';
    // a little leaf sprouting from the back of the head
    g.save(); g.translate(-28,-24); g.rotate(-.9); g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(-4,-14,-20,-22,-30,-18); g.bezierCurveTo(-24,-6,-10,0,0,0); g.closePath();
    g.fillStyle='#6cc22e'; g.fill(); g.strokeStyle='#1d4a10'; g.lineWidth=2.5; g.stroke(); g.restore();
    // neck of the flower mouth
    let ng=g.createLinearGradient(-13,0,13,0); ng.addColorStop(0,hc[3]); ng.addColorStop(.45,hc[1]); ng.addColorStop(1,hc[3]);

let AC=null, master=null, amb=null, sfx=null, noiseBuf=null, lastPew=0;
document.getElementById('unmute').onclick=e=>{ e.currentTarget.remove(); startAudio(); };
function startAudio(){
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain(); master.gain.value=.9; master.connect(AC.destination);
  amb=AC.createGain(); amb.gain.value=settings.music?1:0; amb.connect(master); sfx=AC.createGain(); sfx.connect(master);
  const len=AC.sampleRate*2; noiseBuf=AC.createBuffer(1,len,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true; const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=380; const g=AC.createGain(); g.gain.value=.05; s.connect(f); f.connect(g); g.connect(amb); s.start();
  setInterval(()=>{ if(zombies.size && Math.random()<.35) groan(); },2600);
}
function tone(f,t,d,a,type='sine',dest){ const o=AC.createOscillator(); o.type=type; o.frequency.value=f; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.01); g.gain.exponentialRampToValueAtTime(.0005,t+d); o.connect(g); g.connect(dest||sfx); o.start(t); o.stop(t+d+.05); return o; }
function pew(type){ if(!AC) return; const now=performance.now(); if(now-lastPew<45) return; lastPew=now; const t=AC.currentTime, f=type===2?1300:type===3?600:950, o=tone(f,t,.09,.05,type===3?'sawtooth':'square'); o.frequency.exponentialRampToValueAtTime(f*.45,t+.08); }
function noiseHit(t,d,a,freq,type='lowpass'){ const s=AC.createBufferSource(); s.buffer=noiseBuf; const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=AC.createGain(); g.gain.setValueAtTime(a,t); g.gain.exponentialRampToValueAtTime(.001,t+d); s.connect(f); f.connect(g); g.connect(sfx); s.start(t,rand(0,1),d+.05); }
function boom(big){ if(!AC) return; const t=AC.currentTime; noiseHit(t,big?2.2:.9,big?.9:.6,big?380:700); const o=tone(big?70:110,t,big?1.6:.6,big?.5:.35); o.frequency.exponentialRampToValueAtTime(30,t+(big?1.4:.5)); }
function groan(){ if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(rand(85,120),t); o.frequency.linearRampToValueAtTime(rand(60,80),t+1.2); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=rand(400,700); f.Q.value=4; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.06,t+.3); g.gain.exponentialRampToValueAtTime(.001,t+1.3); o.connect(f); f.connect(g); g.connect(amb); o.start(t); o.stop(t+1.4); }
function siren(){ if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(); o.type='sawtooth'; const g=AC.createGain(); g.gain.value=.06; for(let i=0;i<3;i++){ o.frequency.setValueAtTime(500,t+i*.45); o.frequency.linearRampToValueAtTime(900,t+i*.45+.4); } o.connect(g); g.connect(sfx); o.start(t); o.stop(t+1.35); }
function fanfare(win){ if(!AC) return; const t=AC.currentTime, notes=win?[523,659,784,1047]:[392,330,262,196]; notes.forEach((f,i)=>tone(f,t+i*.16,.5,.12,'triangle')); }
function ramp(node,v){ if(!node) return; const t=AC.currentTime; node.gain.cancelScheduledValues(t); node.gain.setValueAtTime(node.gain.value,t); node.gain.linearRampToValueAtTime(v,t+.4); }
const ttsQ=[]; let ttsPlaying=false;
function playTTS(){ if(ttsPlaying||!ttsQ.length||!AC) return; ttsPlaying=true; const el=new Audio(ttsQ.shift()), src=AC.createMediaElementSource(el), g=AC.createGain(); g.gain.value=1.3; src.connect(g); g.connect(master);
  el.onplay=()=>ramp(amb,settings.music?.3:0); el.onended=el.onerror=()=>{ ramp(amb,settings.music?1:0); ttsPlaying=false; setTimeout(playTTS,300); }; el.play().catch(()=>{ ttsPlaying=false; }); }

let ws=null;
function setCap(c){ if(!c||c===cap) return; cap=c; for(const [id,P] of plants) if(P.slot>=cap) removePlant(id); }
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='mất kết nối server… đang thử lại'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data), now=performance.now();
    switch(m.t){
      case 'state':
        if(m.overlay && m.overlay!==location.pathname){ location.replace(m.overlay+location.search); return; }   // the server switched theme
        Object.assign(settings,m.settings); applySettings();
        plants.clear(); slotOwner.fill(null); cap=m.cap||30; for(const v of m.viewers||[]) addPlant(v,true);
        zombies.clear(); for(const z of m.zombies||[]) addZombie(z); turrets.clear(); setTurrets(m.turrets||[]); for(const T of turrets.values()) T.built=1;
        if(m.game){ game=m.game; renderGame(); } renderBoard('dmgList',m.dmg,shortNum); renderBoard('killList',m.kills,String); setGiftMap(m.giftMap); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); setCap(m.cap); break;
      case 'giftmap': setGiftMap(m.giftMap); break;
      case 'join': setCap(m.cap); addPlant(m.v,false); break;
      case 'leave': case 'kick': removePlant(m.id); break;
      case 'wilt': { const P=plants.get(m.id); if(P) P.wilted=true; } break;
      case 'unwilt': { const P=plants.get(m.id); if(P){ P.wilted=false; P.glow=1; dmgText(P.x,P.y-170,'Tươi lại!','#9bff6a',26); } } break;
      case 'uproot': { const P=plants.get(m.id); if(P){ dmgText(P.x,P.y-150,'👋 rời vườn','#ffd0a0',26); for(let i=0;i<16;i++) parts.push({ k:'chip', x:P.x+rand(-20,20), y:P.y-40, vx:rand(-140,140), vy:rand(-260,-80), t:0, life:1.1, rot:rand(0,6), vr:rand(-8,8) }); removePlant(m.id); } } break;
      case 'ptype': { const P=plants.get(m.id); if(P){ P.type=m.type; P.glow=1; dmgText(P.x,P.y-170,`Đạn ${TYPE_NAME[m.type]}`,TYPE_COL[m.type],26); } } break;
      case 'pup': { const P=plants.get(m.id); if(P){ P.wlv=m.wlv; P.glow=1.2; P.lvUp=now; const c=LV_COL[m.wlv]||'#ffd23f'; dmgText(P.x,P.y-200,`Cấp ${m.wlv}!`,c,34); for(let i=0;i<22;i++){ const a=rand(0,6.28), v=rand(120,300); parts.push({ k:'spark', x:P.x, y:P.y-90, vx:Math.cos(a)*v, vy:Math.sin(a)*v-80, t:0, life:rand(.5,.9), col:c }); } } } break;
      case 'chat': { const P=plants.get(m.id); if(P) P.bubble={ spr:bubbleSprite(m.text), until:now+4500 }; } break;
      case 'like': { const P=plants.get(m.id); if(P) for(let i=0;i<Math.min(3,m.n||1);i++) parts.push({ k:'heart', x:P.x+rand(-14,14), y:P.y-120, vx:rand(-15,15), vy:-rand(50,90), t:0, life:1.2 }); } break;
      case 'zspawn': addZombie(m.z); break;
      case 'zs': for(const [id,x,y,hp,slow] of m.z){ const Z=zombies.get(id); if(Z && !Z.dead){ if(hp<Z.hp) Z.flash=1; Z.tx=x; if(!Z.hop) Z.ty=y; Z.hp=hp; Z.slow=slow;
        if(Z.helm && hp<=Z.maxHp/2){ Z.helm=false; const h=zHead(Z); dmgText(h.x,h.y-50,'Vỡ nồi!','#d8dde2',26); for(let i=0;i<10;i++) parts.push({ k:'metal', x:h.x+rand(-14,14), y:h.y-30, vx:rand(-160,160), vy:rand(-260,-100), t:0, life:1, rot:rand(0,6), vr:rand(-10,10) }); } } } break;
      case 'zjump': { const Z=zombies.get(m.id); if(Z && !Z.dead){ Z.hop={ t:now, from:Z.y, to:m.to }; Z.ty=m.to; } } break;
      case 'zheal': { const Z=zombies.get(m.id); if(Z) Z.heal=1; for(const id of m.list){ const O=zombies.get(id); if(O && !O.dead){ const h=zHead(O); for(let i=0;i<3;i++) parts.push({ k:'plus', x:h.x+rand(-18,18), y:h.y+rand(-10,20), vx:rand(-10,10), vy:-rand(40,80), t:0, life:1.1 }); } } } break;
      case 'zroar': { const Z=zombies.get(m.id); if(Z){ const h=zHead(Z); dmgText(h.x,h.y-90,'GÀOOO! Gọi đệ tử!','#ff7a5a',34); shake=Math.max(shake,.5); roar(); } } break;
      case 'horde': banner('🧟🧟 ĐÀN ZOMBIE ĐANG TRÀN TỚI!',`${m.n} con cùng lúc · nhấp màn hình thật nhanh!`,'red force',3500); siren(); for(let i=0;i<3;i++) setTimeout(groan,i*250); break;
      case 'boss': banner('👹 BOSS XUẤT HIỆN!',`Màn ${m.level} · ${shortNum(m.hp)} máu · cả vườn tập trung bắn!`,'red force',4500); siren(); shake=Math.max(shake,.6); break;
      case 'turrets': setTurrets(m.list,m.built); break;
      case 'tfire': for(const [slot,zid,eta] of m.list){ const T=turrets.get(slot), Z=zombies.get(zid); if(!T||!Z) continue; const h=zHead(Z);
        T.ang=Math.atan2(h.y-TY,h.x-T.x); T.flash=1; tat();
        tracers.push({ x0:T.x+Math.cos(T.ang)*56, y0:TY+Math.sin(T.ang)*56, t0:now, eta:Math.max(80,eta), zid, lx:h.x, ly:h.y+20*h.s }); } break;
      case 'zdie': { const Z=zombies.get(m.id); if(Z && !Z.dead){ Z.dead={ t:now, dir:Math.random()<.5?-1:1 }; Z.hp=0; const h=zHead(Z);
        for(let i=0;i<14;i++){ const a=rand(0,6.28), v=rand(60,220); parts.push({ k:'goo', x:h.x, y:h.y+30, vx:Math.cos(a)*v, vy:Math.sin(a)*v-80, t:0, life:rand(.6,1) }); }
        if(Z.kind==='fat') for(let i=0;i<16;i++){ const a=rand(0,6.28), v=rand(120,320); parts.push({ k:'goo', x:h.x, y:h.y+60, vx:Math.cos(a)*v, vy:Math.sin(a)*v-120, t:0, life:rand(.7,1.1) }); }
        if(Z.kind==='boss'){ explosion(Z.x,Z.y-120,280,true); banner('🏅 BOSS ĐÃ BỊ HẠ!','Cả vườn quá đỉnh!','gold force',4200); dmgText(h.x,h.y-80,'BOSS GỤC!','#ffd23f',48); }
        else if(m.how!=='nuke') dmgText(h.x,h.y-20,'☠',  '#ffffff',34); } } break;
      case 'zleak': { const Z=zombies.get(m.id); if(Z){ zombies.delete(m.id); if(m.kind==='boss'){ dmgText(Z.x,FENCE_Y-120,'BOSS PHÁ RÀO!','#ff5a4a',46); shake=1.2; boom(true); } else dmgText(Z.x,FENCE_Y-40,'Cắn rào!','#ff9a6a',30); for(let i=0;i<10;i++) parts.push({ k:'chip', x:Z.x+rand(-20,20), y:FENCE_Y, vx:rand(-120,120), vy:rand(-220,-80), t:0, life:1, rot:rand(0,6), vr:rand(-8,8) }); shake=Math.max(shake,.35); }
        game.fence=m.fence; renderGame(); } break;
      case 'shots': { const P=plants.get(m.id); if(P) for(const [zid,delay,eta] of m.list) fire(P,zid,delay,eta,m.type,m.wlv); } break;
      case 'cannon': { const P=plants.get(m.id), from=P?muzzle(P):{ x:540, y:1700 }; if(P) P.recoil=1.5; balls.push({ x0:from.x, y0:from.y, x1:m.x, y1:m.y, t0:now, eta:m.eta, r:m.r, big:!!m.big }); boomSmall(); } break;
      case 'rain': rainUntil=now+3300; break;
      case 'drops': for(const [zid,d] of m.list) setTimeout(()=>{ const Z=zombies.get(zid); if(!Z||Z.dead) return; const h=zHead(Z);
        bullets.push({ x0:h.x+rand(-60,60), y0:SPAWN_Y-180, t0:performance.now(), eta:450, zid, type:m.type, size:1.5, lx:h.x, ly:h.y }); pew(m.type); },d); break;
      case 'nuke': nukeAt=now; siren(); banner('☢️ BOM HẠT NHÂN!',`${m.name} quét sạch zombie!`,'red force',4200); break;
      case 'game': game={ ...game, ...m }; renderGame(); break;
      case 'level': banner(`MÀN ${m.level}`,`${m.total-1} zombie + 👹 BOSS cuối màn!`,'gold',3200); break;
      case 'win': banner(`🏆 QUA MÀN ${m.level}!`,'Cả vườn chiến thắng · Chuẩn bị màn sau','gold force',5200); fanfare(true); for(let i=0;i<120;i++) parts.push({ k:'conf', x:rand(0,W), y:rand(-300,500), vx:rand(-40,40), vy:rand(150,300), t:0, life:rand(3,4.5), rot:rand(0,6), vr:rand(-8,8), col:['#ffd23f','#5cf05a','#5ad0ff','#ff6a2a','#ffffff'][i%5] }); break;
      case 'lose': tracers.length=0; banner('💀 HÀNG RÀO VỠ!',`Thua ở màn ${m.level} · Cả vườn chơi lại từ MÀN 1`,'red force',5200); fanfare(false); shake=1; for(const Z of zombies.values()) Z.dead={ t:now, dir:1 }; break;
      case 'boards': renderBoard('dmgList',m.dmg,shortNum); renderBoard('killList',m.kills,String); break;
      case 'gift': { const P=plants.get(m.id); if(P) P.glow=1.4;
        banner(`${KIND_EMOJI[m.kind]||'🎁'} ${m.kindName.toUpperCase()}`,`${m.name} tặng${m.count>1?' ×'+m.count:''}${m.kind==='nang-cap'?` · súng cấp ${m.wlv}`:''}`,m.kind==='hat-nhan'?'red force':'gold',4200,m.icon); } break;
      case 'follow': banner('➕ FOLLOW = ĐẠI BÁC!',`${m.name} vừa follow`,'',3000); break;
      case 'tts': ttsQ.push(m.url); playTTS(); break;
    }
  };
}
function applySettings(){
  document.getElementById('title').textContent=settings.title||'Vườn Chống Zombie';
  document.getElementById('subtitle').textContent=settings.subtitle||'';
  if(AC) ramp(amb,settings.music?1:0);
}
function boomSmall(){ if(!AC) return; const t=AC.currentTime; noiseHit(t,.3,.4,1200,'bandpass'); }
connect();
document.fonts?.ready.then(()=>{ for(const P of plants.values()) P.tag=null; });

/* ======================= render ======================= */
const ctx=document.getElementById('c').getContext('2d');
let last=performance.now(), fpsN=0, fpsT=0;
const dbg=document.getElementById('debug'); if(DEBUG) dbg.hidden=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;
  shake=Math.max(0,shake-dt*2.2);
  ctx.setTransform(1,0,0,1,shake?rand(-12,12)*shake:0,shake?rand(-12,12)*shake:0);
  ctx.drawImage(BG,0,0);
  // drifting fog over the field
  for(const f of FOG){ f.x+=f.v*dt; if(f.x-f.r>W) f.x=-f.r; ctx.globalAlpha=f.a; ctx.drawImage(glowSprite('#c8d8c0'),f.x-f.r,f.y-f.r*.4,f.r*2,f.r*.8); } ctx.globalAlpha=1;
  if(now<rainUntil){ const a=Math.min(1,(rainUntil-now)/500); ctx.fillStyle=`rgba(0,0,20,${.25*a})`; ctx.fillRect(0,SPAWN_Y-120,W,FENCE_Y-SPAWN_Y+120);
    ctx.strokeStyle=`rgba(200,255,170,${.35*a})`; ctx.lineWidth=2; ctx.beginPath(); for(let i=0;i<60;i++){ const sx=(i*97+now*.9)%W, sy=SPAWN_Y-120+((i*173+now*1.6)%(FENCE_Y-SPAWN_Y+120)); ctx.moveTo(sx,sy); ctx.lineTo(sx-8,sy+34); } ctx.stroke(); }
  // zombies, far ones first
  for(const Z of [...zombies.values()].sort((a,b)=>a.y-b.y)) if(!drawZombie(Z,t,dt,now)) zombies.delete(Z.id);
  // the fence: fewer planks as it gets damaged
  const fr=game.maxFence?game.fence/game.maxFence:1;
  for(let i=0;i<27;i++){ const x=10+i*40, broken=(hash(i*7)%100)/100>fr; if(broken && game.phase==='play'){ ctx.fillStyle='#4a3018'; ctx.fillRect(x+6,FENCE_Y+18,18,26); continue; }
    ctx.fillStyle=i%2?'#8a5a2a':'#9a6a32'; ctx.beginPath(); ctx.moveTo(x+3,FENCE_Y+44); ctx.lineTo(x+3,FENCE_Y); ctx.lineTo(x+15,FENCE_Y-12); ctx.lineTo(x+27,FENCE_Y); ctx.lineTo(x+27,FENCE_Y+44); ctx.closePath(); ctx.fill(); ctx.fillStyle='rgba(0,0,0,.2)'; ctx.fillRect(x+21,FENCE_Y,6,44); }
  ctx.fillStyle='#6a4220'; ctx.fillRect(0,FENCE_Y+10,W,8); ctx.fillRect(0,FENCE_Y+30,W,8);
  // plants, back row last so names stay readable
  const garden=[...plants.values()].sort((a,b)=>a.y-b.y); for(const P of garden) drawPlant(P,t,now,dt); for(const P of garden) drawTag(P);
  for(const T of turrets.values()) drawTurret(T,now,dt);
  renderBoss();
  // bullets home in on their zombie
  for(let i=bullets.length-1;i>=0;i--){ const b=bullets[i], k=Math.min(1,(now-b.t0)/b.eta), Z=zombies.get(b.zid);
    if(Z && !Z.dead){ const h=zHead(Z); b.lx=h.x; b.ly=h.y+30*h.s; }
    const x=lerp(b.x0,b.lx,k), y=lerp(b.y0,b.ly,k), col=TYPE_COL[b.type], r=12*b.size;
    if(k>=1){ bullets.splice(i,1); hitFx(x,y,b.type); continue; }
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=b.type===3?.75:.35; ctx.drawImage(glowSprite(col),x-r*2.6,y-r*2.6,r*5.2,r*5.2);
    ctx.globalAlpha=.25; for(let j=1;j<3;j++){ const kk=Math.max(0,k-j*.035); ctx.drawImage(glowSprite(col),lerp(b.x0,b.lx,kk)-r*1.3,lerp(b.y0,b.ly,kk)-r*1.3,r*2.6,r*2.6); }
    ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
    ctx.drawImage(ballSprite(b.type),x-r*1.25,y-r*1.25,r*2.5,r*2.5);
    if(b.type===3 && Math.random()<.6) parts.push({ k:'spark', x, y, vx:rand(-30,30), vy:rand(20,80), t:0, life:.35, col:'#ffb03a' }); }
  // turret tracers: short bright streaks
  ctx.globalCompositeOperation='lighter'; ctx.lineCap='round';
  for(let i=tracers.length-1;i>=0;i--){ const b=tracers[i], k=Math.min(1,(now-b.t0)/b.eta), Z=zombies.get(b.zid);
    if(Z && !Z.dead){ const h=zHead(Z); b.lx=h.x; b.ly=h.y+20*h.s; }
    const x=lerp(b.x0,b.lx,k), y=lerp(b.y0,b.ly,k);
    if(k>=1){ tracers.splice(i,1); for(let j=0;j<3;j++){ const a=rand(0,6.28), v=rand(60,180); parts.push({ k:'spark', x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v, t:0, life:rand(.2,.4), col:'#ffd060' }); } continue; }
    const kk=Math.max(0,k-.1), x2=lerp(b.x0,b.lx,kk), y2=lerp(b.y0,b.ly,kk);
    ctx.globalAlpha=.5; ctx.strokeStyle='#ff9a30'; ctx.lineWidth=9; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x,y); ctx.stroke();
    ctx.globalAlpha=1; ctx.strokeStyle='#fff6c0'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x,y); ctx.stroke(); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
  // cannon balls arc to their spot and explode
  for(let i=balls.length-1;i>=0;i--){ const c=balls[i], k=Math.min(1,(now-c.t0)/c.eta);
    if(k>=1){ balls.splice(i,1); explosion(c.x1,c.y1,c.r,c.big); continue; }
    const x=lerp(c.x0,c.x1,k), y=lerp(c.y0,c.y1,k)-Math.sin(k*Math.PI)*320, s=1+Math.sin(k*Math.PI)*.5;
    ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(lerp(c.x0,c.x1,k),lerp(c.y0,c.y1,k),14,5,0,0,7); ctx.fill();
    const br=(c.big?24:16)*s; if(c.big){ ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=.6; ctx.drawImage(glowSprite('#ff7a2a'),x-br*2.5,y-br*2.5,br*5,br*5); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1; }
    ctx.fillStyle='#1d1d1d'; ctx.beginPath(); ctx.arc(x,y,br,0,7); ctx.fill(); ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(x-br*.3,y-br*.3,br*.32,0,7); ctx.fill();
    parts.push({ k:'smoke', x, y, vx:0, vy:-10, t:0, life:.6, s:14 }); }
  // explosion rings
  for(let i=blasts.length-1;i>=0;i--){ const b=blasts[i], e=Math.max(0,(now-b.t0)/700); if(e>=1){ blasts.splice(i,1); continue; }
    ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=(1-e)*.9; const rr2=b.r*(.4+e*.9); ctx.drawImage(glowSprite('#ff8a2a'),b.x-rr2,b.y-rr2,rr2*2,rr2*2); ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=(1-e); ctx.strokeStyle='#ffe0a0'; ctx.lineWidth=6*(1-e); ctx.beginPath(); ctx.ellipse(b.x,b.y,b.r*e*1.1,b.r*e*.6,0,0,7); ctx.stroke(); ctx.globalAlpha=1; }
  // nuke: a bomb falls, a white flash, a fireball and a shockwave across the field
  if(nukeAt){ const e=(now-nukeAt)/1000;
    if(e<1.4){ const y=lerp(-80,900,ease(e/1.4)); ctx.fillStyle='#2a2a2a'; rr(ctx,520,y-60,40,90,18); ctx.fill(); ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(540,y-20,9,0,7); ctx.fill(); ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.moveTo(522,y-58); ctx.lineTo(540,y-84); ctx.lineTo(558,y-58); ctx.fill(); }
    else if(e<1.45){ flashW=1; boom(true); shake=1.4; }
    else if(e<5){ const k=(e-1.45)/3.5; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=Math.max(0,1-k)*.9; const fr2=200+k*500; ctx.drawImage(glowSprite('#ff9a3a'),540-fr2,950-fr2,fr2*2,fr2*2);
      ctx.globalAlpha=Math.max(0,1-k); ctx.strokeStyle='#fff2c0'; ctx.lineWidth=14*(1-k); ctx.beginPath(); ctx.ellipse(540,950,k*1200,k*700,0,0,7); ctx.stroke(); ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
      if(Math.random()<.5) parts.push({ k:'smoke', x:540+rand(-120,120), y:950+rand(-60,60), vx:rand(-40,40), vy:rand(-160,-60), t:0, life:2.5, s:rand(60,110) }); }
    else nukeAt=0; }
  // particles
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt; if(p.t>p.life){ parts.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; const a=Math.min(1,(p.life-p.t)*2.5);
    if(p.k==='spark'){ p.vx*=.96; p.vy=p.vy*.96+200*dt; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a; ctx.drawImage(glowSprite(p.col),p.x-8,p.y-8,16,16); ctx.globalCompositeOperation='source-over'; }
    else if(p.k==='smoke'){ ctx.globalAlpha=a*.35; ctx.fillStyle='#3a3a36'; ctx.beginPath(); ctx.arc(p.x,p.y,p.s*(1+p.t*.6),0,7); ctx.fill(); }
    else if(p.k==='goo'){ p.vy+=500*dt; ctx.globalAlpha=a; ctx.fillStyle='#6a9a3a'; ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7); ctx.fill(); }
    else if(p.k==='ice'){ p.rot+=dt*4; ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle='#bff0ff'; ctx.fillRect(-4,-4,8,8); ctx.restore(); }
    else if(p.k==='chip'||p.k==='leaf'||p.k==='conf'){ if(p.k!=='conf') p.vy+=500*dt; p.rot+=p.vr*dt; ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.k==='chip'?'#8a5a2a':p.col; ctx.fillRect(-7,-3,14,6); ctx.restore(); }
    else if(p.k==='metal'){ p.vy+=600*dt; p.rot+=p.vr*dt; ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle='#aab0b6'; ctx.fillRect(-6,-3,12,6); ctx.restore(); }
    else if(p.k==='plus'){ ctx.globalAlpha=a; ctx.font=`800 26px ${FONT}`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle='#7aff9a'; ctx.fillText('+',p.x,p.y); }
    else if(p.k==='heart'){ ctx.globalAlpha=a; ctx.fillStyle='#ff5a7a'; ctx.font=`22px ${FONT}`; ctx.textAlign='center'; ctx.fillText('♥',p.x,p.y); } }
  ctx.globalAlpha=1;
  // floating texts
  ctx.textAlign='center'; ctx.textBaseline='middle';
  for(let i=texts.length-1;i>=0;i--){ const x=texts[i]; x.t+=dt; if(x.t>1.3){ texts.splice(i,1); continue; } ctx.globalAlpha=Math.min(1,(1.3-x.t)*2); ctx.font=`800 ${x.size}px ${FONT}`; ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,.75)'; ctx.strokeText(x.text,x.x,x.y-x.t*50); ctx.fillStyle=x.col; ctx.fillText(x.text,x.x,x.y-x.t*50); }
  ctx.globalAlpha=1;
  // chat bubbles (newest 4)
  [...plants.values()].filter(P=>P.bubble&&now<P.bubble.until).sort((a,b)=>b.bubble.until-a.bubble.until).slice(0,4).forEach(P=>{ const b=P.bubble.spr; ctx.drawImage(b,P.x-b.width/2,P.y-170-b.height); });
  if(flashW>0){ ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=`rgba(255,255,255,${flashW})`; ctx.fillRect(0,0,W,H); flashW=Math.max(0,flashW-dt*1.6); }
  if(DEBUG){ fpsN++; fpsT+=dt; if(fpsT>=1){ dbg.textContent=`${Math.round(fpsN/fpsT)} fps · ${zombies.size} zombie · ${plants.size} cây · ${bullets.length+tracers.length} đạn · ${turrets.size} ụ · ${parts.length} hạt`; fpsN=0; fpsT=0; } }
}
requestAnimationFrame(frame);
</script>

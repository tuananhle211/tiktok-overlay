<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay 9:16 · Đêm Hoa Đăng</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,500;0,700;1,400&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Overlay for TikTok LIVE Studio / OBS. A 1080×1920 stage scaled to the window: the river scene is drawn on a canvas,
   the HUD (title, counters, guide, leaderboard, banners) sits on top as HTML. Night scene by design. */
:root{
  --fg:#f4ead6; --muted:#b9b2cc; --gold:#f0b860; --gold2:#ffdca0; --red:#8a2a1e;
  --panel:rgba(9,12,30,.74); --line:rgba(240,184,96,.5);
  --display:"Noto Serif",Georgia,serif; --body:"Be Vietnam Pro",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--body);color:var(--fg)}
#fit{position:fixed;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center;overflow:hidden;background:#04060f}
#c{position:absolute;inset:0;width:1080px;height:1920px}
.ui{position:absolute;z-index:3}
#plaque{left:90px;right:90px;top:70px;height:150px;border:3px solid var(--gold);border-radius:28px;
  background:linear-gradient(180deg,rgba(30,24,58,.9),rgba(10,10,28,.9));box-shadow:0 0 0 6px rgba(0,0,0,.3),0 0 50px rgba(240,184,96,.22) inset;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#plaque::before,#plaque::after{content:"✦";position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:var(--gold)}
#plaque::before{left:36px}#plaque::after{right:36px}
#title{font-family:var(--display);font-weight:700;font-size:58px;letter-spacing:.06em;color:var(--gold2);text-transform:uppercase;text-shadow:0 2px 0 #20103a,0 0 20px rgba(255,200,120,.35)}
#subtitle{font-family:var(--display);font-size:30px;letter-spacing:.1em;color:var(--fg)}
#pills{top:244px;left:0;right:0;display:flex;justify-content:center;gap:26px}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:12px 28px;font-size:34px;font-weight:600;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.pill small{font-size:20px;font-weight:500;color:var(--muted);line-height:1.05}
.dot{width:18px;height:18px;border-radius:50%;background:#ffc36a;box-shadow:0 0 14px #ffb347}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 22px;font-size:25px;line-height:1.4;backdrop-filter:blur(4px)}
/* left: every gift → lantern rule at once (TikTok gift pictures, no gift names) */
#legend{left:20px;top:600px;width:412px;padding:14px 16px 10px}
#legend h3{margin:0 0 6px;text-align:center;font-family:var(--display);font-size:26px;color:var(--gold2);white-space:nowrap}
#legendList{max-height:680px;overflow:hidden}
.lg{display:flex;align-items:center;gap:8px;min-height:52px}
.lg+.lg{border-top:1px solid rgba(240,184,96,.16)}
.lg .gifts{position:relative;width:150px;height:46px;flex:none}
.lg .gifts>*{position:absolute;top:1px;width:44px;height:44px}
.lg .gifts img{object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
.lg .gchip{border-radius:10px;background:rgba(255,255,255,.1);font-size:11px;line-height:1.1;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.lg .arr{color:var(--gold);font-size:24px;flex:none}
.lg canvas{width:52px;height:46px;flex:none}
.lg .lname{font-weight:600;font-size:23px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
/* right: leaderboard, then how to take part */
#side{right:20px;top:600px;width:296px;display:flex;flex-direction:column;gap:14px}
#hint{font-size:23px;line-height:1.35}
#hint b{color:var(--gold2)}
#hint div+div{border-top:1px solid rgba(240,184,96,.3);margin-top:8px;padding-top:8px}
#merit{text-align:center}
#merit h3{margin:0 0 8px;font-family:var(--display);font-size:26px;color:var(--gold2);letter-spacing:0;white-space:nowrap}
#merit ol{margin:0;padding:0;list-style:none;text-align:left;display:grid;gap:6px}
#merit li{display:flex;justify-content:space-between;gap:10px}
#merit li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#merit li span:last-child{color:var(--gold2);font-variant-numeric:tabular-nums}
#merit .empty{color:var(--muted);text-align:center}
#glowBanner{left:110px;right:110px;top:330px;padding:22px 30px;text-align:center;border-radius:24px;border:2px solid var(--gold);
  background:rgba(14,14,38,.86);opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s}
#glowBanner.show{opacity:1;transform:none}
#glowBanner h4{margin:0 0 8px;font-family:var(--display);color:var(--gold2);font-size:30px;letter-spacing:.1em}
#glowBanner p{margin:0;font-family:var(--display);font-style:italic;font-size:30px;line-height:1.45}
#gift{left:70px;right:70px;top:330px;z-index:5;padding:30px 40px;text-align:center;border-radius:28px;border:3px solid var(--gold2);
  background:radial-gradient(ellipse at 50% 0%,rgba(150,64,30,.95),rgba(26,16,44,.95));box-shadow:0 0 60px rgba(255,190,90,.45);
  opacity:0;transform:scale(.85);transition:opacity .45s,transform .45s cubic-bezier(.2,1.4,.4,1)}
#gift.show{opacity:1;transform:none}
#gift .who{font-family:var(--display);font-weight:700;font-size:52px;color:var(--gold2)}
#gift .what{font-size:36px;margin-top:6px}
#gift .gicon{width:64px;height:64px;object-fit:contain;vertical-align:middle;margin:-14px 2px -10px}
#gift .pray{font-family:var(--display);font-style:italic;font-size:32px;color:var(--fg);margin-top:12px;opacity:.95}
#unmute{position:absolute;z-index:9;left:50%;top:1540px;transform:translateX(-50%);font:600 36px var(--body);padding:22px 44px;border-radius:24px;border:3px solid var(--gold2);background:var(--red);color:#fff4dc;cursor:pointer}
#conn{position:absolute;z-index:4;right:16px;bottom:12px;font-size:20px;color:var(--muted);opacity:.6}
#debug{position:absolute;z-index:9;left:16px;bottom:12px;font:22px/1.3 ui-monospace,Consolas,monospace;color:#9fe0b4;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px}
@media (prefers-reduced-motion:reduce){#glowBanner,#gift{transition:none}}
</style>
</head>
<body>
<div id="fit"><div id="stage">
  <canvas id="c" width="1080" height="1920"></canvas>
  <div id="plaque" class="ui"><div id="title">Đêm Hoa Đăng</div><div id="subtitle">Thả đèn · Gửi ước nguyện</div></div>
  <div id="pills" class="ui">
    <div class="pill"><span class="dot"></span><span id="count">0</span><small>đèn trên<br>sông</small></div>
    <div class="pill">⏱ <span id="timer">00:00:00</span></div>
  </div>
  <div id="legend" class="card ui"><h3>✦ Tặng quà · Thả đèn ✦</h3><div id="legendList"></div></div>
  <div id="side" class="ui">
    <div id="merit" class="card"><h3>✦ Đèn Sáng Nhất ✦</h3><ol id="meritList"><li class="empty">Chưa có</li></ol></div>
    <div id="hint" class="card">
      <div>💬 <b>Bình luận</b> để thả một chiếc đèn ước nguyện</div>
      <div>Gõ <b>đỏ · vàng · hồng · xanh · tím · cam</b> để đổi màu đèn</div>
    </div>
  </div>
  <div id="glowBanner" class="ui"><h4>✦ CÙNG THẢ ĐÈN ƯỚC NGUYỆN ✦</h4><p id="glowText"></p></div>
  <div id="gift" class="ui"><div class="who" id="giftWho"></div><div class="what" id="giftWhat"></div><div class="pray" id="giftPray"></div></div>
  <button id="unmute">🔔 Bấm để bật âm thanh</button>
  <div id="conn">đang kết nối…</div>
  <div id="debug" hidden></div>
</div></div>

<script>
/* ======================= stage fit ======================= */
const stage=document.getElementById('stage');
function fit(){ const s=Math.min(innerWidth/1080, innerHeight/1920); stage.style.transform=`translate(-50%,-50%) scale(${s})`; }
addEventListener('resize',fit); fit();
const DEBUG=new URLSearchParams(location.search).has('debug');

/* ======================= scene constants ======================= */
// Perspective: a lantern is born at the bottom edge (scale 1) and drifts towards the far bank over driftSec.
const W=1080, H=1920, HORIZON=1010, NEAR_Y=1835, ZFAR=7.5, MOON={x:540,y:790,r:52};   // moon sits between the two cards, clear of the banners
const PAL={ do:'#ff4d3d', vang:'#ffc23e', hong:'#ff76b6', xanh:'#36d3c3', tim:'#b483ff', cam:'#ff8c3a' };
// a gift lantern keeps the colour its gift suggests (red rose, pink pig…) unless the viewer picked a colour themselves
const NATURAL={ 'hoa-hong':'do', 'trai-tim':'hong', 'ong-sao':'vang', 'long-tron':'do', 'con-heo':'hong', 'den-doi':'do', 'hoa-sen':'hong', 'den-giay':'vang', 'mua-den':'vang', 'phao-hoa':'vang', 'den-troi':'vang' };
const FONT='"Be Vietnam Pro",system-ui,sans-serif';
const hexRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(h,to,a)=>{ const c=hexRgb(h), d=to==='w'?255:0; return `rgb(${c.map(v=>Math.round(v+(d-v)*a)).join(',')})`; };
const rgba=(h,a)=>`rgba(${hexRgb(h).join(',')},${a})`;
const rand=(a,b)=>a+Math.random()*(b-a);
function seeded(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function canvas(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function heartPath(g,x=0,y=0,k=1){ g.beginPath(); g.moveTo(x,y+8*k); g.bezierCurveTo(x-13*k,y-1*k,x-9*k,y-13*k,x,y-6*k); g.bezierCurveTo(x+9*k,y-13*k,x+13*k,y-1*k,x,y+8*k); g.closePath(); }

/* ======================= cached sprites ======================= */
// Everything that does not move is drawn once into an offscreen canvas; each frame only copies it.
const cache={};
function glowSprite(hex){
  return cache['g'+hex] ||= (()=>{ const c=canvas(256,256), g=c.getContext('2d'), gr=g.createRadialGradient(128,128,0,128,128,128);
    gr.addColorStop(0,rgba(hex,.9)); gr.addColorStop(.22,rgba(hex,.38)); gr.addColorStop(1,rgba(hex,0)); g.fillStyle=gr; g.fillRect(0,0,256,256); return c; })();
}
const SPR=2;   // lantern sprites are drawn at 2× so big gift lanterns stay sharp
function flame(g,x,y,k=1){ const gr=g.createRadialGradient(x,y,1,x,y,10*k); gr.addColorStop(0,'#fffef2'); gr.addColorStop(.5,'#ffd36a'); gr.addColorStop(1,'rgba(255,140,40,0)'); g.fillStyle=gr; g.beginPath(); g.ellipse(x,y,6*k,10*k,0,0,7); g.fill(); }
function floatBase(g,w){ g.fillStyle='#2b1b12'; rr(g,-w,-12,w*2,12,4); g.fill(); g.fillStyle='rgba(255,210,150,.25)'; g.fillRect(-w+2,-12,w*2-4,2); }
function innerGlow(g,x,y,r){ const gr=g.createRadialGradient(x,y,2,x,y,r); gr.addColorStop(0,'rgba(255,250,228,.9)'); gr.addColorStop(1,'rgba(255,244,210,0)'); return gr; }
function edge(g,hex,gold,w=1.6){ g.lineWidth=gold?3:w; g.strokeStyle=gold?'#ffd47c':mix(hex,'k',.55); g.stroke(); }
function paperBody(g,hex,gold,dx=0,k=1){
  g.save(); g.translate(dx,0); g.scale(k,k);
  const bw=40, tw=46, y0=-12, y1=-80, body=()=>{ g.beginPath(); g.moveTo(-bw,y0); g.lineTo(-tw,y1); g.lineTo(tw,y1); g.lineTo(bw,y0); g.closePath(); };
  body(); const gr=g.createLinearGradient(-tw,0,tw,0); gr.addColorStop(0,mix(hex,'k',.35)); gr.addColorStop(.5,mix(hex,'w',.45)); gr.addColorStop(1,mix(hex,'k',.35)); g.fillStyle=gr; g.fill();
  body(); g.fillStyle=innerGlow(g,0,-40,46); g.fill();
  g.strokeStyle='rgba(70,30,12,.35)'; g.lineWidth=1.3; for(const s of [-.5,0,.5]){ g.beginPath(); g.moveTo(s*bw,y0); g.lineTo(s*tw,y1); g.stroke(); }
  body(); edge(g,hex,gold);
  g.fillStyle=gold?'#ffd47c':mix(hex,'k',.5); g.fillRect(-tw-3,y1-4,2*tw+6,5);
  flame(g,0,y1-8);
  g.restore();
}
// Each lantern kind: sprite size, anchor (waterline centre), where its name tag sits (top) and where its flames glow.
const SHAPES={
  'den-giay':{ w:140,h:130,ax:70,ay:122,top:100,flames:[[0,-88]], draw(g,hex,gold){ floatBase(g,50); paperBody(g,hex,gold); } },
  'hoa-sen':{ w:180,h:150,ax:90,ay:138,top:92,flames:[[0,-58]], draw(g,hex,gold){
    g.fillStyle='#163a2a'; g.beginPath(); g.ellipse(0,-6,78,14,0,0,7); g.fill(); g.fillStyle='rgba(120,200,140,.2)'; g.beginPath(); g.ellipse(-6,-9,58,7,0,0,7); g.fill();
    const petal=(deg,len,wd,cy,fill,alpha=1)=>{ g.save(); g.globalAlpha=alpha; g.translate(0,cy); g.rotate(deg*Math.PI/180); g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(wd,-len*.5,0,-len); g.quadraticCurveTo(-wd,-len*.5,0,0);
      g.fillStyle=fill; g.fill(); g.strokeStyle=gold?'rgba(255,212,124,.6)':'rgba(255,255,255,.28)'; g.lineWidth=1; g.stroke(); g.restore(); };
    let gr=g.createLinearGradient(0,-90,0,-12); gr.addColorStop(0,mix(hex,'w',.55)); gr.addColorStop(1,mix(hex,'k',.25));
    for(const d of [-80,-54,-27,0,27,54,80]) petal(d,64,24,-14,gr);
    g.fillStyle=innerGlow(g,0,-42,42); g.beginPath(); g.arc(0,-42,42,0,7); g.fill();
    flame(g,0,-58,1.1);
    gr=g.createLinearGradient(0,-70,0,-8); gr.addColorStop(0,mix(hex,'w',.72)); gr.addColorStop(1,mix(hex,'w',.18));
    for(const d of [-64,-36,36,64]) petal(d,50,22,-10,gr);
    petal(0,34,18,-10,gr,.85); } },
  'hoa-hong':{ w:180,h:140,ax:90,ay:128,top:100,flames:[[0,-86]], draw(g,hex,gold){
    for(const s of [-1,1]){ g.save(); g.translate(s*36,-8); g.rotate(s*-.28); g.fillStyle='#1c4a2e'; g.beginPath(); g.ellipse(0,0,38,11,0,0,7); g.fill(); g.fillStyle='rgba(130,210,150,.3)'; g.fillRect(-30,-1,60,2); g.restore(); }
    const dark=mix(hex,'k',.4), base=mix(hex,'k',.08), light=mix(hex,'w',.38);
    const cup=(w,h,y0,c1,c2)=>{ g.beginPath(); g.moveTo(-w,y0); g.bezierCurveTo(-w*1.08,y0-h*.62,-w*.55,y0-h,0,y0-h*.9); g.bezierCurveTo(w*.55,y0-h,w*1.08,y0-h*.62,w,y0); g.quadraticCurveTo(0,y0+h*.16,-w,y0); g.closePath();
      const gr=g.createLinearGradient(0,y0-h,0,y0); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fill(); g.strokeStyle='rgba(255,255,255,.2)'; g.lineWidth=1.2; g.stroke(); };
    const petal=(deg,len,wd,fill)=>{ g.save(); g.translate(0,-14); g.rotate(deg*Math.PI/180); g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(wd,-len*.3,wd*1.1,-len*.85,0,-len); g.bezierCurveTo(-wd*1.1,-len*.85,-wd,-len*.3,0,0); g.fillStyle=fill; g.fill(); g.restore(); };
    for(const d of [-60,60]) petal(d,54,26,dark);
    cup(46,66,-12,base,dark);
    g.fillStyle=innerGlow(g,0,-50,44); g.beginPath(); g.arc(0,-50,44,0,7); g.fill();
    cup(34,70,-16,light,base);
    cup(22,62,-24,mix(hex,'w',.55),light);
    g.strokeStyle=dark; g.lineWidth=2.2; g.lineCap='round';
    g.beginPath(); g.arc(0,-74,12,Math.PI*1.05,Math.PI*2.05); g.stroke();
    g.beginPath(); g.arc(2,-76,7,Math.PI*.1,Math.PI*1.2); g.stroke();
    g.beginPath(); g.arc(-1,-75,3.5,Math.PI,Math.PI*2.2); g.stroke();
    for(const s of [-1,1]){ g.beginPath(); g.moveTo(0,-10); g.bezierCurveTo(s*26,-8,s*50,-26,s*44,-56); g.bezierCurveTo(s*30,-44,s*14,-30,0,-10); g.fillStyle=mix(hex,'k',.2); g.fill(); g.strokeStyle='rgba(255,255,255,.22)'; g.lineWidth=1; g.stroke(); }
    if(gold){ g.strokeStyle='#ffd47c'; g.lineWidth=2.5; g.beginPath(); g.ellipse(0,-10,46,6,0,0,7); g.stroke(); }
    flame(g,0,-86,.9); } },
  'trai-tim':{ w:150,h:140,ax:75,ay:128,top:106,flames:[[0,-92]], draw(g,hex,gold){
    floatBase(g,44);
    const heart=()=>{ g.beginPath(); g.moveTo(0,-14); g.bezierCurveTo(-30,-32,-58,-50,-56,-76); g.bezierCurveTo(-54,-102,-16,-108,0,-84); g.bezierCurveTo(16,-108,54,-102,56,-76); g.bezierCurveTo(58,-50,30,-32,0,-14); g.closePath(); };
    heart(); const gr=g.createLinearGradient(-56,0,56,0); gr.addColorStop(0,mix(hex,'k',.35)); gr.addColorStop(.5,mix(hex,'w',.4)); gr.addColorStop(1,mix(hex,'k',.35)); g.fillStyle=gr; g.fill();
    heart(); g.fillStyle=innerGlow(g,0,-60,50); g.fill();
    g.strokeStyle='rgba(70,30,12,.3)'; g.lineWidth=1.3; g.beginPath(); g.moveTo(0,-84); g.lineTo(0,-14); g.stroke();
    for(const s of [-1,1]){ g.beginPath(); g.moveTo(s*30,-98); g.quadraticCurveTo(s*34,-50,0,-14); g.stroke(); }
    heart(); edge(g,hex,gold);
    flame(g,0,-92,.9); } },
  'ong-sao':{ w:160,h:160,ax:80,ay:146,top:134,flames:[[0,-74]], draw(g,hex,gold){
    g.fillStyle='#2b1b12'; g.beginPath(); g.moveTo(-50,-14); g.quadraticCurveTo(0,8,50,-14); g.lineTo(44,-18); g.lineTo(-44,-18); g.closePath(); g.fill();
    g.fillStyle='#6b4a22'; g.fillRect(-2,-54,4,38);
    const cx=0, cy=-74, R=56, r=24, pts=[]; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, d=i%2?r:R; pts.push([cx+Math.cos(a)*d, cy+Math.sin(a)*d]); }
    const star=()=>{ g.beginPath(); pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.closePath(); };
    star(); const gr=g.createRadialGradient(cx,cy,4,cx,cy,R); gr.addColorStop(0,'#fff6dc'); gr.addColorStop(.45,mix(hex,'w',.35)); gr.addColorStop(1,mix(hex,'k',.25)); g.fillStyle=gr; g.fill();
    g.strokeStyle='rgba(90,45,15,.45)'; g.lineWidth=1.4; for(let i=0;i<10;i+=2){ g.beginPath(); g.moveTo(cx,cy); g.lineTo(pts[i][0],pts[i][1]); g.stroke(); }
    g.beginPath(); for(let i=1;i<10;i+=2){ i===1?g.moveTo(pts[i][0],pts[i][1]):g.lineTo(pts[i][0],pts[i][1]); } g.closePath(); g.stroke();
    star(); edge(g,hex,gold,1.8);
    g.strokeStyle='#ff5a4a'; g.lineWidth=2; for(const i of [2,8]){ const [x,y]=pts[i], s=i===2?1:-1; g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+s*10,y+12,x+s*4,y+26); g.stroke(); } } },
  'long-tron':{ w:130,h:150,ax:65,ay:138,top:128,flames:[[0,-66]], draw(g,hex,gold){
    floatBase(g,40);
    const cy=-66, rx=42, ry=48, trim=gold?'#ffd47c':'#3a2414';
    g.fillStyle=trim; g.fillRect(-16,-22,32,10);
    g.beginPath(); g.ellipse(0,cy,rx,ry,0,0,7); const gr=g.createRadialGradient(-10,cy-10,4,0,cy,ry); gr.addColorStop(0,'#fff3d6'); gr.addColorStop(.5,mix(hex,'w',.25)); gr.addColorStop(1,mix(hex,'k',.35)); g.fillStyle=gr; g.fill();
    g.strokeStyle='rgba(80,30,10,.35)'; g.lineWidth=1.3;
    for(const k of [.35,.7]){ g.beginPath(); g.ellipse(0,cy,rx*k,ry,0,-Math.PI/2,Math.PI/2); g.stroke(); g.beginPath(); g.ellipse(0,cy,rx*k,ry,0,Math.PI/2,Math.PI*1.5); g.stroke(); }
    g.beginPath(); g.moveTo(0,cy-ry); g.lineTo(0,cy+ry); g.stroke();

let AC=null, master=null, musicGain=null, sfx=null, waterOn=null, musicEl=null, noiseBuf=null;

function startAudio(){

  musicGain=AC.createGain(); musicGain.gain.value=settings.music?.45:0; musicGain.connect(master);
  sfx=AC.createGain(); sfx.gain.value=1; sfx.connect(master);

  const len=AC.sampleRate*4, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0); let b=0;
  for(let i=0;i<len;i++){ b=(b+.02*(Math.random()*2-1))/1.02; d[i]=b*3.5; }

const PENTA=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.51,1567.98];
function chime(n){

    for(const [mul,a] of [[1,.11],[2.76,.025]]){ const o=AC.createOscillator(); o.type='sine'; o.frequency.value=f*mul; const g=AC.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(a,t+.006); g.gain.exponentialRampToValueAtTime(.0004,t+2.2); o.connect(g); g.connect(sfx); o.start(t); o.stop(t+2.3); } }

const ttsQ=[]; let ttsPlaying=false;

function playTTS(){

let ws=null;
function connect(){
  ws=new WebSocket(`ws://${location.host}/ws?role=overlay`);
  const st=document.getElementById('conn');
  ws.onopen=()=>{ st.textContent=''; };
  ws.onclose=()=>{ st.textContent='mất kết nối server… đang thử lại'; setTimeout(connect,2000); };
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    switch(m.t){
      case 'state':
        if(m.overlay && m.overlay!==location.pathname){ location.replace(m.overlay+location.search); return; }   // the server switched theme
        Object.assign(settings,m.settings); applySettings(); startedAt=m.startedAt; renderTop(m.top); setGiftMap(m.giftMap); break;
      case 'settings': Object.assign(settings,m.settings); applySettings(); break;
      case 'giftmap': setGiftMap(m.giftMap); break;
      case 'lantern': onLantern(m); break;
      case 'gift': onGift(m); break;
      case 'like': hearts(m); break;
      case 'glow': showGlow(m.text); riverGlow(); chime(5); bell(.45); break;
      case 'bell': chime(6); bell(.5); break;
      case 'leave': byOwner.delete(m.id); break;
      case 'clear': for(const L of lanterns) L.dying=L.dying||.001; skies.length=0; shells.length=0; byOwner.clear(); renderTop([]); break;
      case 'tts': queueTTS(m.url); break;
    }
  };
}

}

    if(p.k==='petal'){ p.x+=Math.sin(p.t*3+i)*24*dt; ctx.save(); ctx.globalAlpha=a; ctx.translate(p.x,p.y); ctx.rotate(p.r+p.t*1.5); ctx.fillStyle=p.col; ctx.beginPath(); ctx.ellipse(0,0,9,5,0,0,7); ctx.fill(); ctx.restore(); }
    else if(p.k==='heart'){ p.x+=Math.sin(p.t*3+i)*20*dt; ctx.globalAlpha=a; ctx.fillStyle=p.col; heartPath(ctx,p.x,p.y,p.s); ctx.fill(); }
    else if(p.k==='fw'){ p.vx*=1-1.5*dt; p.vy=p.vy*(1-1.5*dt)+55*dt; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a*(p.t>p.life*.65?.55+.45*Math.sin(p.t*30+i):1); ctx.drawImage(glowSprite(p.col),p.x-11,p.y-11,22,22); ctx.globalCompositeOperation='source-over'; }
    else { p.vy+=60*dt; p.vx*=.98; ctx.globalCompositeOperation='lighter'; ctx.globalAlpha=a; ctx.drawImage(glowSprite('#ffd27a'),p.x-10,p.y-10,20,20); ctx.globalCompositeOperation='source-over'; } }
  ctx.globalCompositeOperation='lighter'; const fsp=glowSprite('#d8ff7a');
  for(let i=flies.length-1;i>=0;i--){ const f=flies[i]; f.t+=dt; if(f.t>f.life){ flies.splice(i,1); continue; } f.x+=(f.vx+Math.sin(f.t*2.4+f.ph)*30)*dt; f.y+=f.vy*dt;
    ctx.globalAlpha=Math.min(1,(f.life-f.t))*(.45+.55*Math.max(0,Math.sin(f.t*7+f.ph))); ctx.drawImage(fsp,f.x-11,f.y-11,22,22); }
  for(const f of ambient){ f.vx+=(Math.random()-.5)*12*dt; f.vy+=(Math.random()-.5)*12*dt; f.vx*=.99; f.vy*=.99; f.x=(f.x+f.vx*dt*8+W)%W; f.y=Math.max(HORIZON+20,Math.min(H-60,f.y+f.vy*dt*8));
    ctx.globalAlpha=.25+.5*Math.max(0,Math.sin(t*1.3+f.ph)); ctx.drawImage(fsp,f.x-9,f.y-9,18,18); }
  ctx.globalCompositeOperation='source-over'; ctx.globalAlpha=1;
}
let last=performance.now(), fpsN=0, fpsT=0;
const dbg=document.getElementById('debug'); if(DEBUG) dbg.hidden=false;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min((now-last)/1000,.05); last=now; const t=now/1000;
  drawScenery(t,now);
  drawShells(now);
  for(let i=lanterns.length-1;i>=0;i--){ const L=lanterns[i]; if(L.dying) L.dying+=dt/1.4; L.flare=Math.max(0,L.flare-dt*.5); place(L,now,t);
    if(now-L.born>=L.life||L.dying>=1){ lanterns.splice(i,1); if(byOwner.get(L.owner)===L) byOwner.delete(L.owner); } }
  const labels=[];
  for(const L of [...lanterns].sort((a,b)=>b.z-a.z)) drawLantern(L,now,t,labels);
  for(let i=skies.length-1;i>=0;i--) if(!drawSky(skies[i],now,t,labels)) skies.splice(i,1);
  drawParticles(dt,t);
  placeLabels(labels,dt);
  if(DEBUG){ fpsN++; fpsT+=dt; if(fpsT>=1){ dbg.textContent=`${Math.round(fpsN/fpsT)} fps · ${lanterns.length} đèn · ${skies.length} đèn trời · ${flies.length+parts.length} hạt`; fpsN=0; fpsT=0; } }
}
requestAnimationFrame(frame);
</script>
